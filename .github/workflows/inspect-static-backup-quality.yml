name: Inspect static backup quality

permissions:
  contents: read
  checks: read

on:
  push:
    branches: [ss]
    paths:
      - .github/workflows/inspect-static-backup-quality.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: 83350182cf0410360d172565cec39df4cb906d26
    steps:
      - name: Capture external checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def read_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          repository = os.environ['REPOSITORY']
          sha = os.environ['TARGET_SHA']
          check_url = f'https://api.github.com/repos/{repository}/commits/{sha}/check-runs?per_page=100'
          checks = None
          expected = {'SonarCloud Code Analysis', 'Codacy Static Code Analysis'}
          for _ in range(30):
              checks = read_json(check_url)
              selected = {
                  item['name']: item
                  for item in checks.get('check_runs', [])
                  if item.get('name') in expected
              }
              if expected.issubset(selected) and all(
                  item.get('status') == 'completed' for item in selected.values()
              ):
                  break
              time.sleep(10)

          summary = {}
          annotations = {}
          for check in checks.get('check_runs', []):
              if check.get('name') not in expected:
                  continue
              summary[check['name']] = {
                  'status': check.get('status'),
                  'conclusion': check.get('conclusion'),
                  'annotations_count': check.get('output', {}).get('annotations_count', 0),
                  'title': check.get('output', {}).get('title'),
                  'summary': check.get('output', {}).get('summary'),
              }
              if check.get('output', {}).get('annotations_count', 0):
                  annotations[check['name']] = read_json(
                      f"{check['output']['annotations_url']}?per_page=100"
                  )

          with open('external-check-summary.json', 'w', encoding='utf-8') as handle:
              json.dump(summary, handle, indent=2, ensure_ascii=False)
          with open('external-check-annotations.json', 'w', encoding='utf-8') as handle:
              json.dump(annotations, handle, indent=2, ensure_ascii=False)
          PY

      - name: Upload external check evidence
        uses: actions/upload-artifact@v7
        with:
          name: static-backup-quality-${{ github.run_id }}
          path: |
            external-check-summary.json
            external-check-annotations.json
          if-no-files-found: error
          retention-days: 1
