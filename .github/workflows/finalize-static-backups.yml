name: Finalize static backups

permissions:
  contents: write

on:
  push:
    branches: [ss]
    paths:
      - bot/scripts/finalize-static-backups.mjs
      - .github/workflows/finalize-static-backups.yml

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ss
        uses: actions/checkout@v6
        with:
          ref: ss

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: bot/.node-version
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Install locked dependencies without lifecycle scripts
        working-directory: bot
        run: npm ci --ignore-scripts --no-fund --no-audit

      - name: Rebuild trusted native dependency
        working-directory: bot
        run: npm rebuild better-sqlite3 --foreground-scripts

      - name: Apply literal-only backup refactor
        working-directory: bot
        run: node scripts/finalize-static-backups.mjs

      - name: Verify literal-only backup sinks
        working-directory: bot
        run: |
          test "$(grep -c "await db.backup('./data/backups/" src/db.js)" -eq 8
          ! grep -n "db.backup(" src/db.js | grep -v "db.backup('./data/backups/"
          ! grep -R "backupDatabase(destination" src test
          test ! -f src/path-safety.js
          test ! -f test/path-safety.node-test.js

      - name: Validate repository
        working-directory: bot
        run: |
          npm run validate:quest-fixture
          npm test
          npm run check
          npm audit --omit=dev --audit-level=high

      - name: Commit validated refactor
        run: |
          if git diff --quiet; then
            echo "Static backup refactor already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/src/db.js bot/test/final-hardening.node-test.js bot/test/runner-modes.node-test.js
          git add -u bot/src/path-safety.js bot/test/path-safety.node-test.js
          git commit -m "replace generic database backups with literal destinations"
          git push origin HEAD:ss
