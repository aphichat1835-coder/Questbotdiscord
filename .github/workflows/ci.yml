name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, ss]

jobs:
  repository-shape:
    name: Repository shape
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify bot-only repository
        run: |
          test ! -d src
          test ! -d src-tauri
          test ! -d src-runner
          test ! -d src-cdp-launcher
          ! grep -R "panel_\(add\|done\|edit\|delete\)_modal" bot/src
          ! grep -R "getAllQuests\|addQuest\|editQuest\|markDone\|removeQuest" bot/src

  bot-checks:
    name: Bot checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: bot/.node-version
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run bot unit tests
        run: npm test

      - name: Syntax check all source modules
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
