name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, ss]

jobs:
  repository-shape:
    name: Repository shape
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify bot-only repository
        run: |
          test ! -d src
          test ! -d src-tauri
          test ! -d src-runner
          test ! -d src-cdp-launcher
          test -f bot/fixtures/quest-api.sample.json
          test -f bot/scripts/validate-quest-fixture.mjs
          ! grep -R "panel_\(add\|done\|edit\|delete\)_modal" bot/src/index.js
          ! grep -R "getAllQuests\|addQuest\|editQuest\|markDone\|removeQuest" bot/src

  bot-checks:
    name: Bot checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: bot/.node-version
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-fund --no-audit

      - name: Rebuild trusted native dependency
        run: npm rebuild better-sqlite3 --foreground-scripts

      - name: Validate sanitized Quest API fixture
        run: npm run validate:quest-fixture

      - name: Enforce literal-only database backup destinations
        run: |
          test "$(grep -c "await db.backup('./data/backups/" src/db.js)" -eq 8
          ! grep -n "db.backup(" src/db.js | grep -v "db.backup('./data/backups/"
          ! grep -R "backupDatabase(destination" src test
          test ! -f src/path-safety.js
          test ! -f test/path-safety.node-test.js

      - name: Run bot unit tests
        id: tests
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bot-test-output-${{ github.run_id }}
          path: bot/test-output.log
          if-no-files-found: error
          retention-days: 7

      - name: Syntax check all source modules
        run: npm run check

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
