name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, ss]

jobs:
  repository-shape:
    name: Repository shape
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify bot-only repository and runtime data safety
        shell: bash
        run: |
          test ! -d src
          test ! -d src-tauri
          test ! -d src-runner
          test ! -d src-cdp-launcher
          test -f bot/fixtures/quest-api.sample.json
          test -f bot/scripts/validate-quest-fixture.mjs
          test -z "$(grep -R 'panel_\(add\|done\|edit\|delete\)_modal' bot/src/index.js || true)"
          test -z "$(grep -R 'getAllQuests\|addQuest\|editQuest\|markDone\|removeQuest' bot/src || true)"
          test -z "$(git ls-files | grep -E '(^|/)backups/|\.(db|sqlite)(-(wal|shm|journal))?$' || true)"
          git diff --check

  bot-checks:
    name: Bot checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bot
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: bot/.node-version
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-fund --no-audit

      - name: Rebuild trusted native dependency
        run: npm rebuild better-sqlite3 --foreground-scripts

      - name: Validate sanitized Quest API fixture
        run: npm run validate:quest-fixture

      - name: Enforce approved database backup destinations
        shell: bash
        run: |
          node --test test/backup-paths.node-test.js
          if grep -R 'backupDatabase(destination' src test; then
            echo "Unsupported arbitrary backup destination API detected"
            exit 1
          fi
          if grep -R 'DATABASE_BACKUP_DIR' src scripts .env.example; then
            echo "Unsupported DATABASE_BACKUP_DIR runtime/config usage detected"
            exit 1
          fi
          test ! -f src/path-safety.js
          test ! -f test/path-safety.node-test.js

      - name: Enforce incident and storage architecture boundaries
        shell: bash
        run: |
          test -f src/bootstrap.js
          test -f src/bootstrap-reporter.js
          test -f src/incident-catalog.js
          test -f src/legacy-incident-policy.js
          test -f src/storage-profile.js
          test -f src/webhook-delivery.js
          test -f test-support/fake-webhook.js
          test -f INCIDENT-DESIGN.md
          test -z "$(grep -R -E 'process\.env\.DATABASE_PATH\s*=' src || true)"
          test -z "$(grep -R -E 'allowed_mentions:\s*\{\s*parse:\s*\[[^]]' src || true)"
          if grep -R -E 'https://(canary\.|ptb\.)?discord(app)?\.com/api/webhooks/[0-9]{17,20}/' test test-support scripts; then
            echo "Credential-shaped Discord webhook literal detected in test or script code"
            exit 1
          fi
          grep -q "redirect: 'error'" src/webhook-delivery.js
          grep -q 'BACKUP_FAILURE_THRESHOLD = 3' src/worker.js
          grep -q 'BACKUP_MAX_AGE_MS = 26' src/worker.js

      - name: Run recursive tests with coverage gate
        id: tests
        shell: bash
        run: |
          set +e
          npm run test:coverage 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bot-test-output-${{ github.run_id }}
          path: bot/test-output.log
          if-no-files-found: error
          retention-days: 7

      - name: Syntax check all source and script modules
        run: npm run check

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
