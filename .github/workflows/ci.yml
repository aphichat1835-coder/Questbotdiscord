name: CI

permissions:
  contents: write

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, ss]

jobs:
  apply-external-completion-claim:
    name: Apply external completion claim
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'ss' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ss
        uses: actions/checkout@v6
        with:
          ref: ss
          fetch-depth: 0
          show-progress: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: bot/.node-version
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Apply external completion claim handling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          runner_path = Path('bot/src/discord-runner.js')
          runner = runner_path.read_text()
          runner = replace_once(
              runner,
              """    if (quest.completed) {
      if (mode === 'oneshot') return reportOneShotExternalCompletion(quest);
      return { attempted: false, progressed: false, supportedCount: runnable.length };
    }
""",
              """    if (quest.completed) {
      if (mode === 'oneshot') {
        await claimSilently(quest);
        return reportOneShotExternalCompletion(quest);
      }
      return { attempted: false, progressed: false, supportedCount: runnable.length };
    }
""",
              'fresh external completion claim',
          )
          runner = replace_once(
              runner,
              """    if (mode === 'oneshot') {
      const status = completeOneShotQuest(oneShotSession, fresh.id);
      if (status === ONE_SHOT_QUEST_STATUS.COMPLETED_BY_BOT) {
        await claimSilently(fresh);
        return reportOneShotBotCompletion(fresh);
      }
      return reportOneShotExternalCompletion(fresh);
    }
""",
              """    if (mode === 'oneshot') {
      const status = completeOneShotQuest(oneShotSession, fresh.id);
      await claimSilently(fresh);
      if (status === ONE_SHOT_QUEST_STATUS.COMPLETED_BY_BOT) {
        return reportOneShotBotCompletion(fresh);
      }
      return reportOneShotExternalCompletion(fresh);
    }
""",
              'completed manifest quest claim',
          )
          runner_path.write_text(runner)

          test_path = Path('bot/test/runner-modes.node-test.js')
          tests = test_path.read_text()
          tests = replace_once(
              tests,
              "  assert.deepEqual(requests, ['progress:bot-a', 'claim:bot-a']);",
              "  assert.deepEqual(requests, ['progress:bot-a', 'claim:bot-a', 'claim:external-b']);\n  assert.equal(states.get('external-b').claimed, true);",
              'external completion claim expectation',
          )
          test_path.write_text(tests)
          PY

      - name: Install and validate
        working-directory: bot
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          npm rebuild better-sqlite3 --foreground-scripts
          npm test
          npm run check

      - name: Commit source and regression test
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/src/discord-runner.js bot/test/runner-modes.node-test.js
          git commit -m "fix: claim externally completed session quests without attribution"
          git push origin HEAD:ss

  repository-shape:
    name: Repository shape
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify bot-only repository and runtime data safety
        shell: bash
        run: |
          test ! -d src
          test ! -d src-tauri
          test ! -d src-runner
          test ! -d src-cdp-launcher
          test -f bot/fixtures/quest-api.sample.json
          test -f bot/scripts/validate-quest-fixture.mjs
          ! grep -R "panel_\(add\|done\|edit\|delete\)_modal" bot/src/index.js
          ! grep -R "getAllQuests\|addQuest\|editQuest\|markDone\|removeQuest" bot/src
          test -z "$(git ls-files | grep -E '(^|/)backups/|\.(db|sqlite)(-wal|-shm)?$' || true)"
          git diff --check

  bot-checks:
    name: Bot checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: bot/.node-version
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-fund --no-audit

      - name: Rebuild trusted native dependency
        run: npm rebuild better-sqlite3 --foreground-scripts

      - name: Validate sanitized Quest API fixture
        run: npm run validate:quest-fixture

      - name: Enforce approved database backup destinations
        shell: bash
        run: |
          test "$(grep -c "await db.backup(" src/db.js)" -eq 16
          ! grep -n "db.backup(" src/db.js | grep -vE "db.backup\('(\./data|/var/data)/backups/"
          ! grep -R "backupDatabase(destination" src test
          ! grep -R "DATABASE_BACKUP_DIR" src scripts test .env.example README.md
          test ! -f src/path-safety.js
          test ! -f test/path-safety.node-test.js

      - name: Run recursive tests with coverage gate
        id: tests
        shell: bash
        run: |
          set +e
          npm run test:coverage 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bot-test-output-${{ github.run_id }}
          path: bot/test-output.log
          if-no-files-found: error
          retention-days: 7

      - name: Syntax check all source and script modules
        run: npm run check

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
