name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, ss]

jobs:
  repository-shape:
    name: Repository shape
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify bot-only repository
        run: |
          test ! -d src
          test ! -d src-tauri
          test ! -d src-runner
          test ! -d src-cdp-launcher
          ! grep -R "panel_\(add\|done\|edit\|delete\)_modal" bot/src/index.js
          ! grep -R "getAllQuests\|addQuest\|editQuest\|markDone\|removeQuest" bot/src

  bot-checks:
    name: Bot checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: bot/.node-version
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-fund --no-audit

      - name: Apply audited runner codemod
        run: node scripts/apply-runner-hardening.mjs

      - name: Upload hardened runner
        uses: actions/upload-artifact@v4
        with:
          name: hardened-discord-runner
          path: bot/src/discord-runner.js
          if-no-files-found: error
          retention-days: 7

      - name: Run bot unit tests
        id: tests
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-test-output-${{ github.run_id }}
          path: bot/test-output.log
          if-no-files-found: error
          retention-days: 7

      - name: Syntax check all source modules
        run: npm run check

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
