name: CI

permissions:
  contents: write

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, ss]

jobs:
  repository-shape:
    name: Repository shape
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify bot-only repository
        run: |
          test ! -d src
          test ! -d src-tauri
          test ! -d src-runner
          test ! -d src-cdp-launcher
          ! grep -R "panel_\(add\|done\|edit\|delete\)_modal" bot/src/index.js
          ! grep -R "getAllQuests\|addQuest\|editQuest\|markDone\|removeQuest" bot/src

  bot-checks:
    name: Bot checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || '' }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: bot/.node-version
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Resolve upgraded dependencies
        working-directory: bot
        run: npm install --no-fund --no-audit

      - name: Commit generated lockfile once
        if: github.event_name == 'push' && github.ref == 'refs/heads/ss'
        run: |
          if git diff --quiet -- bot/package-lock.json; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/package-lock.json
          git commit -m "lock upgraded bot dependencies"
          git push origin HEAD:ss

      - name: Run bot unit tests
        id: tests
        working-directory: bot
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-test-output-${{ github.run_id }}
          path: bot/test-output.log
          if-no-files-found: error
          retention-days: 7

      - name: Syntax check all source modules
        working-directory: bot
        run: npm run check

      - name: Production dependency audit
        working-directory: bot
        run: npm audit --omit=dev --audit-level=high
