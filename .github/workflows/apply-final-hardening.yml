name: Apply final audit hardening

permissions:
  contents: write

on:
  push:
    branches: [ss]

jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, '[hardening-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ss
        uses: actions/checkout@v6
        with:
          ref: ss
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: bot/.node-version
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Apply audited fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          ROOT = Path('.')

          def read(path):
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path, content):
              (ROOT / path).write_text(content, encoding='utf-8')

          def replace(path, old, new, count=1):
              content = read(path)
              actual = content.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} exact matches, found {actual}')
              write(path, content.replace(old, new, count))

          def regex_replace(path, pattern, replacement, count=1, flags=0):
              content = read(path)
              updated, actual = re.subn(pattern, replacement, content, count=count, flags=flags)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} regex matches, found {actual}: {pattern}')
              write(path, updated)

          def append_once(path, marker, section):
              content = read(path)
              if marker not in content:
                  write(path, content.rstrip() + '\n\n' + section.strip() + '\n')

          # Strict environment validation.
          write('bot/src/config.js', r"""import 'dotenv/config';

          function configurationError(message) {
            throw new Error(`Invalid environment configuration: ${message}`);
          }

          function readRequired(name) {
            const value = process.env[name]?.trim();
            if (!value) configurationError(`${name} is required and cannot be blank`);
            return value;
          }

          function readOptional(name, fallback = '') {
            return process.env[name]?.trim() || fallback;
          }

          function validateSnowflake(name, value, { optional = false } = {}) {
            if (optional && !value) return value;
            if (!/^\d{17,20}$/.test(value)) {
              configurationError(`${name} must be a 17-20 digit Discord snowflake`);
            }
            return value;
          }

          function readBoolean(name, fallback = false) {
            const raw = process.env[name]?.trim().toLowerCase();
            if (raw == null || raw === '') return fallback;
            if (['1', 'true', 'yes', 'on'].includes(raw)) return true;
            if (['0', 'false', 'no', 'off'].includes(raw)) return false;
            configurationError(`${name} must be true/false, 1/0, yes/no or on/off`);
          }

          function readInteger(name, fallback, { min, max } = {}) {
            const raw = process.env[name]?.trim();
            if (raw == null || raw === '') return fallback;
            if (!/^-?\d+$/.test(raw)) configurationError(`${name} must be a whole number`);
            const value = Number(raw);
            if (!Number.isSafeInteger(value)) configurationError(`${name} is outside the safe integer range`);
            if (min != null && value < min) configurationError(`${name} must be at least ${min}`);
            if (max != null && value > max) configurationError(`${name} must be at most ${max}`);
            return value;
          }

          function validateTimeZone(name, value) {
            try {
              new Intl.DateTimeFormat('en-US', { timeZone: value }).format();
            } catch {
              configurationError(`${name} is not a valid IANA timezone`);
            }
            return value;
          }

          function validateSecret(name, value, minLength = 16) {
            if (value && value.length < minLength) {
              configurationError(`${name} must be at least ${minLength} characters when configured`);
            }
            return value;
          }

          function validateVersion(name, value) {
            if (value && !/^\d+(?:\.\d+){1,3}$/.test(value)) {
              configurationError(`${name} must contain numeric dot-separated version parts`);
            }
          }

          const clientId = validateSnowflake('DISCORD_CLIENT_ID', readRequired('DISCORD_CLIENT_ID'));
          const guildId = validateSnowflake('DISCORD_GUILD_ID', readRequired('DISCORD_GUILD_ID'));
          const ownerId = validateSnowflake('OWNER_ID', readRequired('OWNER_ID'));
          const managerRoleId = validateSnowflake(
            'MANAGER_ROLE_ID',
            readOptional('MANAGER_ROLE_ID'),
            { optional: true },
          );
          const logChannelId = validateSnowflake(
            'LOG_CHANNEL_ID',
            readOptional('LOG_CHANNEL_ID'),
            { optional: true },
          );
          const timezone = validateTimeZone('TIMEZONE', readOptional('TIMEZONE', 'Asia/Bangkok'));
          const discordTimezone = validateTimeZone(
            'DISCORD_TIMEZONE',
            readOptional('DISCORD_TIMEZONE', timezone),
          );

          for (const name of [
            'DISCORD_CLIENT_VERSION',
            'DISCORD_CHROME_VERSION',
            'DISCORD_ELECTRON_VERSION',
          ]) {
            validateVersion(name, readOptional(name));
          }
          readInteger('DISCORD_BUILD_NUMBER', 0, { min: 0 });
          readInteger('DISCORD_NATIVE_BUILD_NUMBER', 0, { min: 0 });

          export const config = Object.freeze({
            token: readRequired('DISCORD_BOT_TOKEN'),
            clientId,
            guildId,
            ownerId,
            timezone,
            discordTimezone,
            logChannelId,
            managerRoleId,
            databasePath: readOptional('DATABASE_PATH', './data/quests.db'),
            databaseBackupEnabled: readBoolean('DATABASE_BACKUP_ENABLED', false),
            databaseBackupRetention: readInteger('DATABASE_BACKUP_RETENTION', 7, { min: 1, max: 7 }),
            runnerTokenSecret: validateSecret(
              'RUNNER_TOKEN_SECRET',
              readOptional('RUNNER_TOKEN_SECRET'),
              16,
            ),
            healthStatusToken: validateSecret(
              'HEALTH_STATUS_TOKEN',
              readOptional('HEALTH_STATUS_TOKEN'),
              16,
            ),
            port: readInteger('PORT', 3000, { min: 1, max: 65535 }),
          });
          """.replace('          ', ''))

          # Centralized safe error formatting.
          write('bot/src/error-reporter.js', r"""import { config } from './config.js';

          let discordClient = null;
          const recentlyReported = new Map();
          const DEDUPE_MS = 60_000;
          const SENSITIVE_KEY = /authorization|token|secret|cookie|captcha|email/i;

          export function setErrorReporterClient(client) {
            discordClient = client;
          }

          function sanitizeValue(value, seen = new WeakSet(), depth = 0) {
            if (value == null || typeof value !== 'object') return value;
            if (depth >= 5) return '[TRUNCATED]';
            if (seen.has(value)) return '[CIRCULAR]';
            seen.add(value);

            if (Array.isArray(value)) {
              return value.slice(0, 50).map((item) => sanitizeValue(item, seen, depth + 1));
            }

            const output = {};
            for (const [key, item] of Object.entries(value).slice(0, 50)) {
              output[key] = SENSITIVE_KEY.test(key)
                ? '[REDACTED]'
                : sanitizeValue(item, seen, depth + 1);
            }
            return output;
          }

          function printable(value) {
            if (typeof value === 'string') return value;
            try {
              return JSON.stringify(sanitizeValue(value));
            } catch {
              return String(value);
            }
          }

          export function redactSensitive(value) {
            return printable(value)
              .replace(
                /((?:authorization|token|secret|cookie|captcha(?:_[a-z0-9_]+)?|email)["']?\s*[:=]\s*["']?)([^"',}\s]+)/gi,
                '$1[REDACTED]',
              )
              .replace(/\b[\w-]{20,}\.[\w-]{5,}\.[\w-]{15,}\b/g, '[REDACTED_TOKEN]')
              .slice(0, 1500);
          }

          export function safeErrorMessage(error) {
            return redactSensitive(error?.message ?? error ?? 'Unknown error');
          }

          export async function reportCriticalError(source, error, { notify = true } = {}) {
            const safeMessage = redactSensitive(error?.stack || error?.message || error);
            console.error(`❌ [${redactSensitive(source)}]`, safeMessage);

            if (!notify || !config.logChannelId || !discordClient?.isReady?.()) return;
            const key = `${source}:${safeMessage.slice(0, 250)}`;
            const now = Date.now();
            for (const [reportedKey, reportedAt] of recentlyReported) {
              if (now - reportedAt >= DEDUPE_MS) recentlyReported.delete(reportedKey);
            }
            if (now - (recentlyReported.get(key) ?? 0) < DEDUPE_MS) return;
            recentlyReported.set(key, now);

            try {
              const channel = await discordClient.channels.fetch(config.logChannelId);
              if (!channel?.isTextBased?.()) return;
              await channel.send({
                content: [
                  `🚨 **Critical Error — ${redactSensitive(source)}**`,
                  '```',
                  safeMessage.slice(0, 1700),
                  '```',
                ].join('\n'),
              });
            } catch (reportError) {
              console.error(
                '❌ [ErrorReporter] Discord notification failed:',
                safeErrorMessage(reportError),
              );
            }
          }
          """.replace('          ', ''))

          # Reusable owner/account admission locks.
          write('bot/src/run-admission-lock.js', r"""const ownerQueues = new Map();
          const accountQueues = new Map();

          async function withKeyedLock(queues, key, operation, label) {
            if (!key) throw new TypeError(`${label} is required`);
            if (typeof operation !== 'function') throw new TypeError('operation must be a function');

            const previous = queues.get(key) ?? Promise.resolve();
            let release;
            const gate = new Promise((resolve) => {
              release = resolve;
            });
            const queued = previous.then(() => gate);
            queues.set(key, queued);

            await previous;
            try {
              return await operation();
            } finally {
              release();
              if (queues.get(key) === queued) queues.delete(key);
            }
          }

          export function withOwnerAdmissionLock(ownerId, operation) {
            return withKeyedLock(ownerQueues, ownerId, operation, 'ownerId');
          }

          export function withAccountAdmissionLock(accountId, operation) {
            return withKeyedLock(accountQueues, accountId, operation, 'accountId');
          }
          """.replace('          ', ''))

          # Runtime lease table and helpers enforce one live process per shared DB.
          replace(
            'bot/src/db.js',
            """  CREATE INDEX IF NOT EXISTS idx_scheduled_runners_owner
              ON scheduled_runners(owner_id);
          `);""",
            """  CREATE INDEX IF NOT EXISTS idx_scheduled_runners_owner
              ON scheduled_runners(owner_id);

            CREATE TABLE IF NOT EXISTS runtime_leases (
              name       TEXT PRIMARY KEY,
              holder     TEXT NOT NULL,
              expires_at INTEGER NOT NULL
            );
          `);""",
          )
          replace(
            'bot/src/db.js',
            """export function closeDatabase() {
            if (db.open) db.close();
          }
          """,
            """const acquireRuntimeLeaseTransaction = db.transaction((name, holder, ttlMs, now) => {
            db.prepare('DELETE FROM runtime_leases WHERE expires_at <= ?').run(now);
            const existing = db.prepare('SELECT holder FROM runtime_leases WHERE name = ?').get(name);
            if (existing && existing.holder !== holder) return false;
            db.prepare(`
              INSERT INTO runtime_leases (name, holder, expires_at)
              VALUES (?, ?, ?)
              ON CONFLICT(name) DO UPDATE SET
                holder = excluded.holder,
                expires_at = excluded.expires_at
            `).run(name, holder, now + ttlMs);
            return true;
          });

          export function acquireRuntimeLease(name, holder, ttlMs = 90_000) {
            if (!name || !holder) throw new TypeError('Runtime lease name and holder are required');
            return acquireRuntimeLeaseTransaction(name, holder, ttlMs, Date.now());
          }

          export function renewRuntimeLease(name, holder, ttlMs = 90_000) {
            return db.prepare(`
              UPDATE runtime_leases
              SET expires_at = ?
              WHERE name = ? AND holder = ?
            `).run(Date.now() + ttlMs, name, holder).changes > 0;
          }

          export function releaseRuntimeLease(name, holder) {
            return db.prepare(
              'DELETE FROM runtime_leases WHERE name = ? AND holder = ?',
            ).run(name, holder).changes > 0;
          }

          export function closeDatabase() {
            if (db.open) db.close();
          }
          """,
          )

          # Global persisted-account lookup.
          replace(
            'bot/src/scheduled-runner-store.js',
            """export function findScheduledRunner(ownerId, accountId) {
            return db.prepare(
              'SELECT * FROM scheduled_runners WHERE owner_id = ? AND account_id = ?',
            ).get(ownerId, accountId) ?? null;
          }
          """,
            """export function findScheduledRunner(ownerId, accountId) {
            return db.prepare(
              'SELECT * FROM scheduled_runners WHERE owner_id = ? AND account_id = ?',
            ).get(ownerId, accountId) ?? null;
          }

          export function findAnyScheduledRunner(accountId) {
            return db.prepare(
              'SELECT * FROM scheduled_runners WHERE account_id = ? ORDER BY id ASC LIMIT 1',
            ).get(accountId) ?? null;
          }
          """,
          )

          # Transient scheduled retry policy.
          replace(
            'bot/src/runner-schedule.js',
            """export const RECHECK_COUNT = 3;
          export const RECHECK_INTERVAL_MS = 5 * 60 * 1000;
          """,
            """export const RECHECK_COUNT = 3;
          export const RECHECK_INTERVAL_MS = 5 * 60 * 1000;
          const TRANSIENT_RETRY_DELAYS_MS = Object.freeze([
            5 * 60 * 1000,
            15 * 60 * 1000,
            30 * 60 * 1000,
          ]);

          export function transientRetryDelayMs(attempt = 0) {
            const index = Math.max(0, Math.min(TRANSIENT_RETRY_DELAYS_MS.length - 1, attempt));
            return TRANSIENT_RETRY_DELAYS_MS[index];
          }
          """,
          )

          # Status aggregate only reflects active jobs; pruning never removes active entries.
          replace(
            'bot/src/quest-status-store.js',
            """function prune() {
            if (statuses.size <= MAX_STATUS_ENTRIES) return;
            const entries = [...statuses.entries()].sort(
              ([, left], [, right]) => Date.parse(left.updatedAt) - Date.parse(right.updatedAt),
            );
            while (statuses.size > MAX_STATUS_ENTRIES && entries.length) {
              statuses.delete(entries.shift()[0]);
            }
          }
          """,
            """function prune() {
            if (statuses.size <= MAX_STATUS_ENTRIES) return;
            const entries = [...statuses.entries()]
              .filter(([, status]) => !['running', 'stopping'].includes(status.lifecycle))
              .sort(([, left], [, right]) => Date.parse(left.updatedAt) - Date.parse(right.updatedAt));
            while (statuses.size > MAX_STATUS_ENTRIES && entries.length) {
              statuses.delete(entries.shift()[0]);
            }
          }
          """,
          )
          replace(
            'bot/src/quest-status-store.js',
            """function aggregate(items) {
            if (!items.length) return emptyStatus('aggregate', { lifecycle: 'idle' });
            const latestError = [...items]
          """,
            """function aggregate(items) {
            const activeItems = items.filter((item) => ['running', 'stopping'].includes(item.lifecycle));
            if (!activeItems.length) return emptyStatus('aggregate', { lifecycle: 'idle' });
            items = activeItems;
            const latestError = [...items]
          """,
          )
          replace(
            'bot/src/quest-status-store.js',
            """    accountCount: items.length,
          """,
            """    accountCount: new Set(items.map((item) => item.accountId).filter(Boolean)).size,
          """,
          )

          # Run command: global account lock, global conflict lookup and bounded token input.
          replace(
            'bot/src/commands/run.js',
            """  findUserJobByAccount,
            getUserJobs,
            startRunner,
          } from '../discord-runner.js';
          import { isAccountStopping } from '../runner-control.js';
          import { withOwnerAdmissionLock } from '../run-admission-lock.js';
          """,
            """  findAnyJobByAccount,
            getUserJobs,
            startRunner,
          } from '../discord-runner.js';
          import { isAccountStopping } from '../runner-control.js';
          import {
            withAccountAdmissionLock,
            withOwnerAdmissionLock,
          } from '../run-admission-lock.js';
          """,
          )
          replace(
            'bot/src/commands/run.js',
            """  findScheduledRunner,
            listScheduledRunners,
          } from '../scheduled-runner-store.js';

          export const data = new SlashCommandBuilder()
          """,
            """  findAnyScheduledRunner,
            listScheduledRunners,
          } from '../scheduled-runner-store.js';

          const MAX_TOKENS_PER_SUBMISSION = 10;

          export const data = new SlashCommandBuilder()
          """,
          )
          replace(
            'bot/src/commands/run.js',
            """  if (findUserJobByAccount(ownerId, account.id) || findScheduledRunner(ownerId, account.id)) {
              return `⚠️ **${account.username}** มี Runner ทำงานอยู่แล้ว`;
            }
          """,
            """  if (findAnyJobByAccount(account.id) || findAnyScheduledRunner(account.id)) {
              return `⚠️ **${account.username}** มี Runner ทำงานอยู่แล้วในระบบ`;
            }
          """,
          )
          replace(
            'bot/src/commands/run.js',
            """    const conflict = accountConflict(context.ownerId, inspection.account);
              if (conflict) {
                results.push(conflict);
                continue;
              }

              const outcome = await startAccountRunner(context, token, inspection.account);
              results.push(outcome.line);
              if (outcome.started) started++;
          """,
            """    const outcome = await withAccountAdmissionLock(inspection.account.id, async () => {
                const conflict = accountConflict(context.ownerId, inspection.account);
                if (conflict) return { started: false, line: conflict };
                return startAccountRunner(context, token, inspection.account);
              });
              results.push(outcome.line);
              if (outcome.started) started++;
          """,
          )
          replace(
            'bot/src/commands/run.js',
            """  if (!tokens.length) {
              return interaction.reply({ flags: 64, content: '❌ ไม่พบ token กรุณาใส่อย่างน้อย 1 token' });
            }

            await interaction.deferReply(modal.isScheduled ? {} : { flags: 64 });
          """,
            """  if (!tokens.length) {
              return interaction.reply({ flags: 64, content: '❌ ไม่พบ token กรุณาใส่อย่างน้อย 1 token' });
            }
            if (tokens.length > MAX_TOKENS_PER_SUBMISSION) {
              return interaction.reply({
                flags: 64,
                content: `❌ รับได้สูงสุด ${MAX_TOKENS_PER_SUBMISSION} token ต่อครั้ง กรุณาแบ่งส่งใหม่`,
              });
            }

            await interaction.deferReply(modal.isScheduled ? {} : { flags: 64 });
          """,
          )

          # Discord runner hardening.
          replace(
            'bot/src/discord-runner.js',
            """  nextRecheckState,
            nextScheduledCheck,
            RECHECK_INTERVAL_MS,
          } from './runner-schedule.js';
          """,
            """  nextRecheckState,
            nextScheduledCheck,
            RECHECK_INTERVAL_MS,
            transientRetryDelayMs,
          } from './runner-schedule.js';
          """,
          )
          replace(
            'bot/src/discord-runner.js',
            """    super(`Discord API ${status}: ${JSON.stringify(data)}`);
          """,
            """    super(`Discord API ${status} at ${path}`);
          """,
          )
          replace(
            'bot/src/discord-runner.js',
            """async function readFreshQuestForMutation(token, questId, signal) {
            try {
              return (await fetchQuests(token, signal)).find((quest) => quest.id === questId) ?? null;
            } catch (error) {
              if (isFatalAuthError(error) || isAbortFailure(error, signal)) throw error;
              return null;
            }
          }
          """,
            """async function readFreshQuestForMutation(token, questId, signal) {
            return (await fetchQuests(token, signal)).find((quest) => quest.id === questId) ?? null;
          }
          """,
          )
          replace(
            'bot/src/discord-runner.js',
            """export function findUserJobByAccount(ownerId, accountId) {
            for (const [key, job] of jobs) {
              if (job.ownerId === ownerId && job.accountId === accountId) {
                return { key, ...job.summary() };
              }
            }
            return null;
          }
          """,
            """export function findUserJobByAccount(ownerId, accountId) {
            for (const [key, job] of jobs) {
              if (job.ownerId === ownerId && job.accountId === accountId) {
                return { key, ...job.summary() };
              }
            }
            return null;
          }

          export function findAnyJobByAccount(accountId) {
            for (const [key, job] of jobs) {
              if (job.accountId === accountId) return { key, ...job.summary() };
            }
            return null;
          }
          """,
          )
          replace(
            'bot/src/discord-runner.js',
            """export async function shutdownRunners(timeoutMs = 10_000) {
            const activeJobs = [...jobs.values()];
            for (const job of activeJobs) job.controller.abort();

            let timeout;
            try {
              await Promise.race([
                Promise.allSettled([...activeRunPromises]),
                new Promise((resolve) => {
                  timeout = setTimeout(resolve, timeoutMs);
                }),
              ]);
            } finally {
              clearTimeout(timeout);
            }
            return activeJobs.length;
          }
          """,
            """export async function shutdownRunners(timeoutMs = null) {
            const activeJobs = [...jobs.values()];
            for (const job of activeJobs) job.controller.abort();

            const pending = Promise.allSettled([...activeRunPromises]);
            if (timeoutMs == null) {
              await pending;
            } else {
              let timedOut = false;
              let timeout;
              try {
                await Promise.race([
                  pending,
                  new Promise((resolve) => {
                    timeout = setTimeout(() => {
                      timedOut = true;
                      resolve();
                    }, timeoutMs);
                  }),
                ]);
              } finally {
                clearTimeout(timeout);
              }
              if (timedOut && activeRunPromises.size > 0) {
                throw new Error(`Runner shutdown timed out with ${activeRunPromises.size} task(s) pending`);
              }
            }
            return activeJobs.length;
          }
          """,
          )
          replace(
            'bot/src/discord-runner.js',
            """      try {
                if (!liveMsg) {
                  const ch = await resolveOutputChannel();
                  if (!ch?.isTextBased?.()) return;
                  liveMsg = await ch.send({ content });
                } else {
                  await liveMsg.edit({ content });
                }
              } catch (err) {
                console.warn(`[Runner:${jobKey}] status message failed — ${err.message}`);
              }
          """,
            """      const editingExisting = Boolean(liveMsg);
              try {
                if (!liveMsg) {
                  const ch = await resolveOutputChannel();
                  if (!ch?.isTextBased?.()) return;
                  liveMsg = await ch.send({ content });
                } else {
                  await liveMsg.edit({ content });
                }
              } catch (err) {
                if (editingExisting) liveMsg = null;
                console.warn(`[Runner:${jobKey}] status message failed — ${err.message}`);
              }
          """,
          )
          replace(
            'bot/src/discord-runner.js',
            """    let nextCheckpoint = Math.max(25, (Math.floor(initialPercent / 25) + 1) * 25);
              let lastReportedPercent = initialPercent;
              const onServerProgress = async (fresh) => {
                const percent = fresh.completed ? 100 : Math.min(100, Math.floor(fresh.progress));
                if (fresh.progressSecs > 0 || fresh.completed) {
                  recordQuestVerification(currentQuestStatusContext().key, 'progress', currentQuestStatusContext());
                }
          """,
            """    let nextCheckpoint = Math.max(25, (Math.floor(initialPercent / 25) + 1) * 25);
              let lastReportedPercent = initialPercent;
              let lastVerifiedProgressSecs = quest.progressSecs;
              let completionSeen = quest.completed;
              const onServerProgress = async (fresh) => {
                const percent = fresh.completed ? 100 : Math.min(100, Math.floor(fresh.progress));
                if (fresh.progressSecs > lastVerifiedProgressSecs || (fresh.completed && !completionSeen)) {
                  recordQuestVerification(currentQuestStatusContext().key, 'progress', currentQuestStatusContext());
                }
                lastVerifiedProgressSecs = Math.max(lastVerifiedProgressSecs, fresh.progressSecs);
                completionSeen ||= fresh.completed;
          """,
          )
          replace(
            'bot/src/discord-runner.js',
            """      return { attempted: false, progressed: false, supportedCount: 0 };
              }
            }

            async function waitForVerificationRecheck(state, outcome) {
          """,
            """      return {
                attempted: false,
                progressed: false,
                supportedCount: 0,
                transientError: true,
              };
              }
            }

            async function waitForTransientErrorRetry(attempt) {
              const delayMs = transientRetryDelayMs(attempt);
