name: Prune obsolete audit backups

on:
  push:
    branches: [aa.1]

permissions:
  contents: write

jobs:
  prune:
    if: github.event.head_commit.message == 'maintenance prune obsolete audit backups'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Verify final backup and delete obsolete backups
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --exit-code --heads origin refs/heads/backup/aa.1-final-audit-20260729
          for branch in \
            backup/aa.1-before-full-branch-audit-fixes-20260729 \
            backup/aa.1-before-static-analysis-cleanup-20260728 \
            backup/aa.1-before-final-correctness-fixes-20260728
          do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done
