name: Finish ss public status changes

on:
  push:
    branches: [ss]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ss
        uses: actions/checkout@v6
        with:
          ref: ss

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Update restored public response test
        shell: python
        run: |
          from pathlib import Path

          path = Path('bot/test/runner-modes.node-test.js')
          text = path.read_text(encoding='utf-8')
          old_title = "test('/run replies ephemerally and starts a persisted scheduled runner', async () => {"
          new_title = "test('/run replies publicly and starts a persisted scheduled runner', async () => {"
          old_assertion = "assert.deepEqual(deferOptions, { flags: 64 });"
          new_assertion = "assert.deepEqual(deferOptions, {});"
          if old_title not in text or old_assertion not in text:
              raise SystemExit('Expected public-response test lines were not found')
          text = text.replace(old_title, new_title, 1)
          text = text.replace(old_assertion, new_assertion, 1)
          path.write_text(text, encoding='utf-8')

      - name: Install bot dependencies
        working-directory: bot
        run: npm ci

      - name: Run bot tests
        working-directory: bot
        run: npm test

      - name: Check changed source syntax
        working-directory: bot
        run: |
          node --check src/index.js
          node --check src/commands/run.js
          node --check src/commands/panel.js
          node --check src/runner-status-header.js

      - name: Commit tested result and remove temporary workflow
        run: |
          rm .github/workflows/ss-finish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/test/runner-modes.node-test.js .github/workflows/ss-finish.yml
          git commit -m "test: align public run response expectation"
          git push origin HEAD:ss
