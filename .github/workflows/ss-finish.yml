name: Finish pinned runner header on ss

on:
  push:
    branches: [ss]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ss
        uses: actions/checkout@v6
        with:
          ref: ss

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Apply focused patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          path = Path('bot/src/discord-runner.js')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              "  let logoutReported = false;\n  let countAlreadyReported = false;\n  const claimRetryAt = new Map();",
              "  let logoutReported = false;\n  let countAlreadyReported = false;\n  let totalQuestCount = null;\n  let runnableQuestCount = null;\n  const claimRetryAt = new Map();",
              'runner state',
          )
          text = replace_once(
              text,
              "      const visibleLines = [...logLines];\n      let content = '```\\n' + visibleLines.join('\\n') + '\\n```';\n      while (content.length > 1950 && visibleLines.length > 1) {\n        visibleLines.shift();\n        content = '```\\n' + visibleLines.join('\\n') + '\\n```';\n      }",
              "      const headerLines = [\n        `✅ LOGIN : ${username}`,\n        mode === 'scheduled'\n          ? '🤖 AUTO DAILY ENABLED — CHECK 00:00 / 08:00 / 16:00'\n          : null,\n        `🔍 ตรวจพบ Quest ทั้งหมด : ${totalQuestCount ?? 'กำลังตรวจสอบ...'}`,\n        `⚙️ Quest ที่ระบบทำได้ : ${runnableQuestCount ?? 'กำลังตรวจสอบ...'}`,\n        '────────────────────────',\n      ].filter(Boolean);\n      const visibleLines = [...logLines];\n      const buildContent = () => '```\\n'\n        + [...headerLines, ...visibleLines].join('\\n')\n        + '\\n```';\n      let content = buildContent();\n      while (content.length > 1950 && visibleLines.length > 1) {\n        visibleLines.shift();\n        content = buildContent();\n      }",
              'status rendering',
          )
          text = replace_once(
              text,
              "  async function reportRunnableCount(count) {\n    addLog(`🔎 ${username}: พบ ${count} QUESTS`);\n    await render();\n  }",
              "  async function reportQuestCounts(allQuests, runnableCount) {\n    totalQuestCount = allQuests.filter((quest) => !quest.completed).length;\n    runnableQuestCount = runnableCount;\n    await render();\n  }",
              'quest count reporting',
          )
          text = replace_once(
              text,
              "    if (!countAlreadyReported) {\n      await reportRunnableCount(runnable.length);\n    }",
              "    if (!countAlreadyReported) {\n      await reportQuestCounts(allQuests, runnable.length);\n    }",
              'initial count update',
          )
          text = replace_once(
              text,
              "    await reportRunnableCount(supportedRemaining);\n    countAlreadyReported = true;",
              "    await reportQuestCounts(latestQuests, supportedRemaining);\n    countAlreadyReported = true;",
              'remaining count update',
          )
          text = replace_once(
              text,
              "      addLog(`✅ LOGIN : ${username}`);\n      if (mode === 'scheduled') {\n        addLog(`🤖 AUTO DAILY ENABLED — CHECK 00:00 / 08:00 / 16:00`);\n      }\n      await render();",
              "      await render();",
              'login header initialization',
          )
          path.write_text(text, encoding='utf-8')

          path = Path('bot/src/index.js')
          text = path.read_text(encoding='utf-8')
          text = replace_once(text, "import { installPersistentRunnerStatusHeaders } from './runner-status-header.js';\n", '', 'header import')
          text = replace_once(text, 'installPersistentRunnerStatusHeaders(client);\n', '', 'header installer')
          path.write_text(text, encoding='utf-8')

          path = Path('bot/test/runner-modes.node-test.js')
          text = path.read_text(encoding='utf-8')
          old_count = '🔎 scheduled-user: พบ 0 QUESTS'
          if text.count(old_count) != 2:
              raise SystemExit(f'scheduled count assertion: expected 2 matches, found {text.count(old_count)}')
          text = text.replace(old_count, '⚙️ Quest ที่ระบบทำได้ : 0')
          marker = "  assert.match(contents.join('\\n'), /⚙️ Quest ที่ระบบทำได้ : 0/);\n"
          text = replace_once(
              text,
              marker,
              marker
              + "  const finalStatus = contents.at(-1);\n"
              + "  assert.match(finalStatus, /^```\\n✅ LOGIN : scheduled-user\\n🤖 AUTO DAILY ENABLED/);\n"
              + "  assert.match(finalStatus, /🔍 ตรวจพบ Quest ทั้งหมด : 0/);\n"
              + "  assert.match(finalStatus, /⚙️ Quest ที่ระบบทำได้ : 0/);\n",
              'pinned header assertions',
          )
          path.write_text(text, encoding='utf-8')

          Path('bot/src/runner-status-header.js').unlink()
          Path('bot/test/runner-status-header.node-test.js').unlink()

      - name: Install dependencies
        working-directory: bot
        run: npm ci

      - name: Run tests
        working-directory: bot
        run: npm test

      - name: Syntax checks
        working-directory: bot
        run: |
          node --check src/index.js
          node --check src/discord-runner.js
          node --check src/commands/run.js
          node --check src/commands/panel.js

      - name: Commit tested result
        run: |
          rm -f .github/workflows/ss-finish.yml
          rm -f .github/workflows/ss-pin-runner-header.yml
          rm -f .github/ss-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep runner summary pinned"
          git push origin HEAD:ss
