name: Apply coordinator job cleanup

on:
  push:
    branches:
      - aa.1

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout aa.1
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: aa.1
          fetch-depth: 0

      - name: Apply coordinator lifecycle cleanup
        run: python .github/scripts/apply-coordinator-job-cleanup.py

      - name: Validate modules and regression tests
        run: |
          node --check bot/src/quest/rate-limit-coordinator.js
          node --check bot/src/quest/runner-completion-observer.js
          node --check bot/test/coordinator-job-cleanup.node-test.js

      - name: Commit change and remove temporary updater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix release completed coordinator jobs"
          git push origin HEAD:aa.1
