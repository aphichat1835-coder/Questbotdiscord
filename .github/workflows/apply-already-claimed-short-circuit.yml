name: Apply already claimed short circuit

on:
  push:
    branches:
      - aa.1

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout aa.1
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: aa.1
          fetch-depth: 0

      - name: Apply already claimed short circuit
        run: python .github/scripts/apply-already-claimed-short-circuit.py

      - name: Validate runner and regression test syntax
        run: |
          node --check bot/src/discord-runner.js
          node --check bot/test/one-shot-already-claimed.node-test.js

      - name: Commit change and remove temporary updater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix avoid duplicate claim after server confirmation"
          git push origin HEAD:aa.1
