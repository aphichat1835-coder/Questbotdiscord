name: Debug quest redesign tests

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/debug-quest-tests.yml

permissions:
  contents: write

jobs:
  debug:
    if: github.event.pull_request.head.ref == 'ss' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ss
          fetch-depth: 0
          show-progress: false

      - name: Apply patch in diagnostic workspace
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/apply-quest-status-redesign.yml').read_text()
          code = workflow.split("python3 - <<'PY'\n", 1)[1].split("\n          PY\n", 1)[0]
          exec(compile(textwrap.dedent(code), 'apply-workflow', 'exec'))
          PY

      - uses: actions/setup-node@v4
        with:
          node-version-file: bot/.node-version
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Capture validation output
        shell: bash
        run: |
          set +e
          cd bot
          npm ci --ignore-scripts --no-fund --no-audit >/dev/null 2>&1
          npm rebuild better-sqlite3 --foreground-scripts >/dev/null 2>&1
          npm test > ../QUEST_TEST_ERROR.txt 2>&1
          test_status=$?
          npm run check >> ../QUEST_TEST_ERROR.txt 2>&1
          check_status=$?
          printf '\nTEST_STATUS=%s\nCHECK_STATUS=%s\n' "$test_status" "$check_status" >> ../QUEST_TEST_ERROR.txt
          tail -n 220 ../QUEST_TEST_ERROR.txt > ../QUEST_TEST_ERROR.tail
          mv ../QUEST_TEST_ERROR.tail ../QUEST_TEST_ERROR.txt

      - name: Publish diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add QUEST_TEST_ERROR.txt
          git commit -m "chore: record quest redesign test output"
          git push origin HEAD:ss
