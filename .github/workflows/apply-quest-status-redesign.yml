name: Apply quest status redesign

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/apply-quest-status-redesign.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'ss' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ss
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Apply quest status redesign
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, zlib
          exec(zlib.decompress(base64.b64decode('')))
          PY

      - name: Install and validate
        working-directory: bot
        run: |
          npm ci --ignore-scripts
          npm rebuild better-sqlite3
          npm test
          npm run check

      - name: Commit redesign
        shell: bash
        run: |
          git show HEAD^:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm .github/workflows/apply-quest-status-redesign.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/src/discord-runner.js bot/src/runner-status-header.js bot/test/quest-status-redesign.node-test.js .github/workflows/ci.yml .github/workflows/apply-quest-status-redesign.yml
          git commit -m "feat: redesign one-shot quest progress status"
          git push origin HEAD:ss
