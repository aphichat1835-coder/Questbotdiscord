name: Apply quest status redesign

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/apply-quest-status-redesign.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'ss' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ss
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: bot/.node-version
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Apply quest status redesign
        run: python3 .github/scripts/apply-quest-status-redesign.py

      - name: Install and validate
        working-directory: bot
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          npm rebuild better-sqlite3 --foreground-scripts
          npm test
          npm run check

      - name: Commit redesign and clean temporary files
        shell: bash
        run: |
          git show 7ece47a27318ef3a9f68517a89dd63236b9bad1e:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/workflows/apply-quest-status-redesign.yml
          rm -f .github/workflows/debug-quest-patch.yml
          rm -f .github/workflows/debug-quest-tests.yml
          rm -f .github/scripts/apply-quest-status-redesign.py
          rm -f PATCH_ERROR.txt
          rm -f QUEST_TEST_ERROR.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: redesign one-shot quest progress status"
          git push origin HEAD:ss
