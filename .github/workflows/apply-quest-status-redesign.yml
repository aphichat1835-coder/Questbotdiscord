name: Apply quest status redesign

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/apply-quest-status-redesign.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'ss' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ss
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: bot/.node-version
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Apply quest status redesign
        run: python3 .github/scripts/apply-quest-status-redesign.py

      - name: Install and validate
        working-directory: bot
        run: |
          npm ci --ignore-scripts --no-fund --no-audit >/dev/null
          npm rebuild better-sqlite3 --foreground-scripts >/dev/null
          npm test
          npm run check

      - name: Commit source and regression tests
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/src/discord-runner.js
          git add bot/src/runner-status-header.js
          git add bot/test/quest-status-redesign.node-test.js
          git add bot/test/runner-modes.node-test.js
          git add bot/test/runner-status-header.node-test.js
          git commit -m "feat: redesign one-shot quest progress status"
          git push origin HEAD:ss
