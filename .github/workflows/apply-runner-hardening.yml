name: Apply runner hardening

permissions:
  contents: write

on:
  push:
    branches: [ss]
    paths:
      - bot/scripts/apply-runner-hardening.mjs
      - .github/workflows/apply-runner-hardening.yml

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ss
        uses: actions/checkout@v6
        with:
          ref: ss

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: bot/.node-version
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Install locked dependencies
        working-directory: bot
        run: npm ci --no-fund --no-audit

      - name: Apply audited runner codemod
        working-directory: bot
        run: node scripts/apply-runner-hardening.mjs

      - name: Validate runner hardening
        working-directory: bot
        run: |
          npm test
          npm run check
          npm audit --omit=dev --audit-level=high

      - name: Commit hardened runner
        run: |
          if git diff --quiet -- bot/src/discord-runner.js; then
            echo "Runner already hardened"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/src/discord-runner.js
          git commit -m "harden runner lifecycle and client profile"
          git push origin HEAD:ss
