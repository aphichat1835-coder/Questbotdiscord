name: Record Quest payload compatibility failures

permissions:
  contents: write

on:
  push:
    branches: [aa.1]
    paths:
      - '.github/workflows/record-quest-payload-error.yml'
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout aa.1
        uses: actions/checkout@v6
        with:
          ref: aa.1
          fetch-depth: 0

      - name: Record payload compatibility failures at the runner boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('bot/src/discord-runner.js')
          source = path.read_text()
          old = """async function selectQuestPayload(token, signal) {
            return fetchQuestPayload(token, signal);
          }
          """
          new = """async function selectQuestPayload(token, signal) {
            try {
              return await fetchQuestPayload(token, signal);
            } catch (error) {
              if (isAbortFailure(error, signal)) throw abortFailure();
              if (error instanceof QuestCompatibilityError) {
                recordQuestError(error);
                await reportCriticalError('Quest API compatibility', error);
              } else if (isFatalAuthError(error)) {
                recordQuestError(error);
              }
              throw error;
            }
          }
          """
          if source.count(old) != 1:
              raise SystemExit('selectQuestPayload block mismatch')
          path.write_text(source.replace(old, new, 1))
          PY
          node --check bot/src/discord-runner.js

      - name: Commit payload error recording
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot/src/discord-runner.js
          git commit -m 'fix(quest): record payload compatibility failures'
          git push origin HEAD:aa.1
