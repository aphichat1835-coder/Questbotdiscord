name: Apply external completion claim

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/apply-external-completion-claim.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'ss' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ss
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: bot/.node-version
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Apply patch
        run: python3 .github/scripts/apply-external-completion-claim.py

      - name: Install and validate
        working-directory: bot
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          npm rebuild better-sqlite3 --foreground-scripts
          npm test
          npm run check

      - name: Commit source and regression test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/src/discord-runner.js bot/test/runner-modes.node-test.js
          git commit -m "fix: claim externally completed session quests without attribution"
          git push origin HEAD:ss
