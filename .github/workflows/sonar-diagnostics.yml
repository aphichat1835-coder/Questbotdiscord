name: Sonar diagnostics

permissions:
  contents: read
  checks: read

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  inspect-sonar-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Wait for Sonar and print check evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/inspect-sonar-check.mjs

      - name: Upload Sonar evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sonar-evidence-${{ github.run_id }}
          path: sonar-evidence.json
          if-no-files-found: warn
          retention-days: 1
