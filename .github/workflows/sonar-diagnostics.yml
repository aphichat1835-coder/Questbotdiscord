name: Sonar diagnostics

permissions:
  contents: read
  checks: read

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  inspect-sonar-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for Sonar and print check evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}/commits/${HEAD_SHA}/check-runs?per_page=100"
          for attempt in $(seq 1 24); do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api" > checks.json
            if node --input-type=module <<'NODE'
              import fs from 'node:fs';
              const payload = JSON.parse(fs.readFileSync('checks.json', 'utf8'));
              const sonar = payload.check_runs?.find((run) => /sonar/i.test(run.name));
              process.exit(sonar && sonar.status === 'completed' ? 0 : 1);
            NODE
            then
              break
            fi
            sleep 15
          done

          node --input-type=module <<'NODE'
            import fs from 'node:fs';
            const payload = JSON.parse(fs.readFileSync('checks.json', 'utf8'));
            const runs = payload.check_runs?.filter((run) => /sonar/i.test(run.name)) ?? [];
            if (!runs.length) {
              console.log('No completed Sonar check run was visible to the read-only token.');
              process.exit(2);
            }
            for (const run of runs) {
              console.log(JSON.stringify({
                id: run.id,
                name: run.name,
                status: run.status,
                conclusion: run.conclusion,
                details_url: run.details_url,
                annotations_url: run.output?.annotations_url,
                title: run.output?.title,
                summary: run.output?.summary,
                text: run.output?.text,
              }, null, 2));
            }
            fs.writeFileSync('sonar-run-ids.txt', runs.map((run) => run.id).join('\n'));
          NODE

          while IFS= read -r run_id; do
            test -n "$run_id" || continue
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/check-runs/${run_id}/annotations?per_page=100" \
              | node --input-type=module -e '
                  let input="";
                  process.stdin.on("data", (chunk) => input += chunk);
                  process.stdin.on("end", () => {
                    const annotations = JSON.parse(input);
                    console.log(JSON.stringify(annotations.map(({path,start_line,end_line,annotation_level,title,message,raw_details}) => ({path,start_line,end_line,annotation_level,title,message,raw_details})), null, 2));
                  });
                '
          done < sonar-run-ids.txt
