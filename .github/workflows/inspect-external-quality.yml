name: Inspect external quality

permissions:
  contents: read
  checks: read

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/inspect-external-quality.yml
  push:
    branches: [ss]
    paths:
      - .github/workflows/inspect-external-quality.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: d5231cf4168082b06cbb27f7ac39e70a9ca2f841
      SONAR_PROJECT: aphichat1835-coder_neverdie-quest-helper
      SONAR_PR: '3'
    steps:
      - name: Query GitHub checks and SonarQube Cloud
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          repository = os.environ['REPOSITORY']
          sha = os.environ['TARGET_SHA']
          token = os.environ['GH_TOKEN']
          expected = {'SonarCloud Code Analysis', 'Codacy Static Code Analysis'}
          check_url = f'https://api.github.com/repos/{repository}/commits/{sha}/check-runs?per_page=100'

          checks = None
          for _ in range(30):
              request = urllib.request.Request(check_url, headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  checks = json.load(response)
              selected = {
                  item['name']: item
                  for item in checks.get('check_runs', [])
                  if item.get('name') in expected
              }
              if expected.issubset(selected) and all(
                  item.get('status') == 'completed' for item in selected.values()
              ):
                  break
              time.sleep(10)

          with open('quality-checks.json', 'w', encoding='utf-8') as handle:
              json.dump(checks, handle, indent=2, ensure_ascii=False)

          sonar_params = urllib.parse.urlencode({
              'projectKey': os.environ['SONAR_PROJECT'],
              'pullRequest': os.environ['SONAR_PR'],
          })
          sonar_urls = {
              'sonar-gate.json': f'https://sonarcloud.io/api/qualitygates/project_status?{sonar_params}',
              'sonar-issues.json': (
                  'https://sonarcloud.io/api/issues/search?'
                  + urllib.parse.urlencode({
                      'componentKeys': os.environ['SONAR_PROJECT'],
                      'pullRequest': os.environ['SONAR_PR'],
                      'resolved': 'false',
                      'ps': '500',
                  })
              ),
          }
          for filename, url in sonar_urls.items():
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      payload = json.load(response)
              except Exception as error:
                  payload = {'probe_error': type(error).__name__, 'message': str(error)}
              with open(filename, 'w', encoding='utf-8') as handle:
                  json.dump(payload, handle, indent=2, ensure_ascii=False)
          PY

      - name: Upload quality evidence
        uses: actions/upload-artifact@v4
        with:
          name: external-quality-evidence-${{ github.run_id }}
          path: |
            quality-checks.json
            sonar-gate.json
            sonar-issues.json
          if-no-files-found: error
          retention-days: 1
