name: Apply full audit fixes

on:
  pull_request:
    branches:
      - aa
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.number == 15 && github.event.pull_request.head.ref == 'aa.1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout aa.1
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: aa.1
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: bot/.node-version
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Apply exact source fixes
        working-directory: bot
        run: python3 scripts/apply-full-audit-fixes.py

      - name: Install dependencies
        working-directory: bot
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          npm rebuild better-sqlite3 --foreground-scripts

      - name: Run second-pass regression tests
        working-directory: bot
        run: |
          node --import ./test/setup-env.js --test --test-concurrency=1 \
            test/backup-health.node-test.js \
            test/full-audit-security-regressions.node-test.js \
            test/incident-full-audit.node-test.js \
            test/recovery-fetch-policy.node-test.js \
            test/runner-error-classification.node-test.js

      - name: Commit and push verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/src bot/test/backup-health.node-test.js
          git commit -m "fix: close second-pass audit findings"
          git push origin HEAD:aa.1
