name: Debug locked one-shot session tests

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/debug-one-shot-session-tests.yml

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'ss'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ss
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: bot/.node-version
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Apply proposed integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re
          import zlib
          workflow = Path('.github/workflows/apply-one-shot-session-lock.yml').read_text()
          match = re.search(r"payload = '([^']+)'", workflow)
          if not match:
              raise SystemExit('patch payload not found')
          script = zlib.decompress(base64.b64decode(match.group(1))).decode()
          exec(compile(script, 'apply-one-shot-session-lock', 'exec'))
          PY

      - name: Install dependencies
        working-directory: bot
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          npm rebuild better-sqlite3 --foreground-scripts

      - name: Capture focused test failures
        working-directory: bot
        shell: bash
        run: |
          set +e
          npm test > one-shot-test-full.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -n -B 5 -A 35 -E 'not ok|failureType|AssertionError|SyntaxError|ReferenceError|TypeError|ERR_' one-shot-test-full.log > one-shot-test-focused.log || true
          else
            tail -n 80 one-shot-test-full.log > one-shot-test-focused.log
          fi
          printf '%s\n' "$status" > one-shot-test-status.txt
          exit 0

      - name: Upload focused diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: locked-one-shot-test-diagnostics-${{ github.run_id }}
          path: |
            bot/one-shot-test-focused.log
            bot/one-shot-test-status.txt
          if-no-files-found: error
          retention-days: 2

      - name: Fail when tests failed
        working-directory: bot
        shell: bash
        run: exit "$(cat one-shot-test-status.txt)"
