name: Apply status and retry hardening

permissions:
  contents: write

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - bot/scripts/apply-status-retry-hardening.mjs
      - bot/src/quest-status-store.js
      - bot/src/mutation-retry.js
      - bot/test/status-mutation.node-test.js
      - .github/workflows/apply-status-retry-hardening.yml
  push:
    branches: [ss]
    paths:
      - bot/scripts/apply-status-retry-hardening.mjs
      - .github/workflows/apply-status-retry-hardening.yml

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ss
        uses: actions/checkout@v6
        with:
          ref: ss

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: bot/.node-version
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Install locked dependencies
        working-directory: bot
        run: npm ci --no-fund --no-audit

      - name: Apply guarded codemod
        id: codemod
        working-directory: bot
        shell: bash
        run: |
          sed -i 's/changes !== 15/changes !== 16/g; s/Expected 15 changes/Expected 16 changes/g' scripts/apply-status-retry-hardening.mjs
          set +e
          node scripts/apply-status-retry-hardening.mjs 2>&1 | tee codemod-output.log
          status=${PIPESTATUS[0]}
          if (( status )); then
            echo "exit_code=$status" >> "$GITHUB_OUTPUT"
            exit "$status"
          fi
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/discord-runner.js')
          source = path.read_text()
          needle = "  const statusContext = currentQuestStatusContext();\n  recordQuestSuccess("
          if source.count(needle) != 1:
              raise SystemExit(f'Expected one duplicate status context anchor, found {source.count(needle)}')
          source = source.replace(needle, "  recordQuestSuccess(", 1)
          path.write_text(source)
          PY
          echo "exit_code=0" >> "$GITHUB_OUTPUT"

      - name: Upload codemod diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: status-retry-codemod-${{ github.run_id }}
          path: bot/codemod-output.log
          if-no-files-found: error
          retention-days: 7

      - name: Validate hardened repository
        id: validation
        working-directory: bot
        shell: bash
        run: |
          set +e
          {
            npm run validate:quest-fixture
            fixture_status=$?
            npm test
            test_status=$?
            npm run check
            check_status=$?
            npm audit --omit=dev --audit-level=high
            audit_status=$?
            echo "fixture=$fixture_status tests=$test_status check=$check_status audit=$audit_status"
            if (( fixture_status || test_status || check_status || audit_status )); then
              exit 1
            fi
          } 2>&1 | tee hardening-validation.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: status-retry-validation-${{ github.run_id }}
          path: bot/hardening-validation.log
          if-no-files-found: error
          retention-days: 7

      - name: Commit hardened Runner
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- bot/src/discord-runner.js; then
            echo "Runner already hardened"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/src/discord-runner.js
          git commit -m "separate Quest status and verify mutation retries"
          git push origin HEAD:ss
