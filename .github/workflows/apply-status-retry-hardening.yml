name: Apply status and retry hardening

permissions:
  contents: write

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - bot/scripts/apply-status-retry-hardening.mjs
      - bot/src/quest-status-store.js
      - bot/src/mutation-retry.js
      - bot/test/status-mutation.node-test.js
      - .github/workflows/apply-status-retry-hardening.yml
  push:
    branches: [ss]
    paths:
      - bot/scripts/apply-status-retry-hardening.mjs
      - .github/workflows/apply-status-retry-hardening.yml

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ss
        uses: actions/checkout@v6
        with:
          ref: ss

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: bot/.node-version
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Install locked dependencies
        working-directory: bot
        run: npm ci --no-fund --no-audit

      - name: Apply guarded codemod
        id: codemod
        working-directory: bot
        shell: bash
        run: |
          sed -i 's/changes !== 15/changes !== 16/g; s/Expected 15 changes/Expected 16 changes/g' scripts/apply-status-retry-hardening.mjs
          set +e
          node scripts/apply-status-retry-hardening.mjs 2>&1 | tee codemod-output.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload codemod diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: status-retry-codemod-${{ github.run_id }}
          path: bot/codemod-output.log
          if-no-files-found: error
          retention-days: 7

      - name: Validate hardened repository
        working-directory: bot
        run: |
          npm run validate:quest-fixture
          npm test
          npm run check
          npm audit --omit=dev --audit-level=high

      - name: Commit hardened Runner
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- bot/src/discord-runner.js; then
            echo "Runner already hardened"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/src/discord-runner.js
          git commit -m "separate Quest status and verify mutation retries"
          git push origin HEAD:ss
