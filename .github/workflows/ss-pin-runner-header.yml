name: Pin runner header on ss

on:
  push:
    branches: [ss]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ss
        uses: actions/checkout@v6
        with:
          ref: ss

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Apply focused runner header patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {text.count(old)}')
              return text.replace(old, new, 1)

          runner_path = Path('bot/src/discord-runner.js')
          runner = runner_path.read_text(encoding='utf-8')

          runner = replace_once(
              runner,
              """  let logoutReported = false;
          let countAlreadyReported = false;
          const claimRetryAt = new Map();""",
              """  let logoutReported = false;
          let countAlreadyReported = false;
          let totalQuestCount = null;
          let runnableQuestCount = null;
          const claimRetryAt = new Map();""",
              'runner state',
          )

          runner = replace_once(
              runner,
              """      const visibleLines = [...logLines];
              let content = '```\\n' + visibleLines.join('\\n') + '\\n```';
              while (content.length > 1950 && visibleLines.length > 1) {
                visibleLines.shift();
                content = '```\\n' + visibleLines.join('\\n') + '\\n```';
              }""",
              """      const headerLines = [
                `✅ LOGIN : ${username}`,
                mode === 'scheduled'
                  ? '🤖 AUTO DAILY ENABLED — CHECK 00:00 / 08:00 / 16:00'
                  : null,
                `🔍 ตรวจพบ Quest ทั้งหมด : ${totalQuestCount ?? 'กำลังตรวจสอบ...'}`,
                `⚙️ Quest ที่ระบบทำได้ : ${runnableQuestCount ?? 'กำลังตรวจสอบ...'}`,
                '────────────────────────',
              ].filter(Boolean);
              const visibleLines = [...logLines];
              const buildContent = () => '```\\n'
                + [...headerLines, ...visibleLines].join('\\n')
                + '\\n```';
              let content = buildContent();
              while (content.length > 1950 && visibleLines.length > 1) {
                visibleLines.shift();
                content = buildContent();
              }""",
              'status rendering',
          )

          runner = replace_once(
              runner,
              """  async function reportRunnableCount(count) {
              addLog(`🔎 ${username}: พบ ${count} QUESTS`);
              await render();
            }""",
              """  async function reportQuestCounts(allQuests, runnableCount) {
              totalQuestCount = allQuests.filter((quest) => !quest.completed).length;
              runnableQuestCount = runnableCount;
              await render();
            }""",
              'quest count reporting',
          )

          runner = replace_once(
              runner,
              """    if (!countAlreadyReported) {
                await reportRunnableCount(runnable.length);
              }""",
              """    if (!countAlreadyReported) {
                await reportQuestCounts(allQuests, runnable.length);
              }""",
              'initial count update',
          )

          runner = replace_once(
              runner,
              """    await reportRunnableCount(supportedRemaining);
              countAlreadyReported = true;""",
              """    await reportQuestCounts(latestQuests, supportedRemaining);
              countAlreadyReported = true;""",
              'remaining count update',
          )

          runner = replace_once(
              runner,
              """      addLog(`✅ LOGIN : ${username}`);
              if (mode === 'scheduled') {
                addLog(`🤖 AUTO DAILY ENABLED — CHECK 00:00 / 08:00 / 16:00`);
              }
              await render();""",
              """      await render();""",
              'login header initialization',
          )

          runner_path.write_text(runner, encoding='utf-8')

          index_path = Path('bot/src/index.js')
          index_text = index_path.read_text(encoding='utf-8')
          index_text = replace_once(
              index_text,
              "import { installPersistentRunnerStatusHeaders } from './runner-status-header.js';\n",
              '',
              'remove temporary header import',
          )
          index_text = replace_once(
              index_text,
              'installPersistentRunnerStatusHeaders(client);\n',
              '',
              'remove temporary header installer',
          )
          index_path.write_text(index_text, encoding='utf-8')

          test_path = Path('bot/test/runner-modes.node-test.js')
          test_text = test_path.read_text(encoding='utf-8')
          test_text = test_text.replace(
              '🔎 scheduled-user: พบ 0 QUESTS',
              '⚙️ Quest ที่ระบบทำได้ : 0',
          )
          marker = "  assert.match(contents.join('\\n'), /⚙️ Quest ที่ระบบทำได้ : 0/);\n"
          if test_text.count(marker) != 1:
              raise SystemExit(f'runner header assertion marker count: {test_text.count(marker)}')
          test_text = test_text.replace(
              marker,
              marker
              + "  const finalStatus = contents.at(-1);\n"
              + "  assert.match(finalStatus, /^```\\n✅ LOGIN : scheduled-user\\n🤖 AUTO DAILY ENABLED/);\n"
              + "  assert.match(finalStatus, /🔍 ตรวจพบ Quest ทั้งหมด : 0/);\n"
              + "  assert.match(finalStatus, /⚙️ Quest ที่ระบบทำได้ : 0/);\n",
              1,
          )
          test_path.write_text(test_text, encoding='utf-8')

          Path('bot/src/runner-status-header.js').unlink()
          Path('bot/test/runner-status-header.node-test.js').unlink()

      - name: Install bot dependencies
        working-directory: bot
        run: npm ci

      - name: Run bot tests
        working-directory: bot
        run: npm test

      - name: Check changed source syntax
        working-directory: bot
        run: |
          node --check src/index.js
          node --check src/discord-runner.js
          node --check src/commands/run.js
          node --check src/commands/panel.js

      - name: Commit tested result and remove temporary workflow
        run: |
          rm .github/workflows/ss-pin-runner-header.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep runner summary pinned"
          git push origin HEAD:ss
