name: Pin runner header on ss

on:
  push:
    branches: [ss]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ss
        uses: actions/checkout@v6
        with:
          ref: ss

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Apply focused runner header patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          runner_path = Path('bot/src/discord-runner.js')
          runner = runner_path.read_text(encoding='utf-8')

          old = "  let logoutReported = false;\n  let countAlreadyReported = false;\n  const claimRetryAt = new Map();"
          new = "  let logoutReported = false;\n  let countAlreadyReported = false;\n  let totalQuestCount = null;\n  let runnableQuestCount = null;\n  const claimRetryAt = new Map();"
          runner = replace_once(runner, old, new, 'runner state')

          old = (
              "      const visibleLines = [...logLines];\n"
              "      let content = '```\\n' + visibleLines.join('\\n') + '\\n```';\n"
              "      while (content.length > 1950 && visibleLines.length > 1) {\n"
              "        visibleLines.shift();\n"
              "        content = '```\\n' + visibleLines.join('\\n') + '\\n```';\n"
              "      }"
          )
          new = (
              "      const headerLines = [\n"
              "        `✅ LOGIN : ${username}`,\n"
              "        mode === 'scheduled'\n"
              "          ? '🤖 AUTO DAILY ENABLED — CHECK 00:00 / 08:00 / 16:00'\n"
              "          : null,\n"
              "        `🔍 ตรวจพบ Quest ทั้งหมด : ${totalQuestCount ?? 'กำลังตรวจสอบ...'}`,\n"
              "        `⚙️ Quest ที่ระบบทำได้ : ${runnableQuestCount ?? 'กำลังตรวจสอบ...'}`,\n"
              "        '────────────────────────',\n"
              "      ].filter(Boolean);\n"
              "      const visibleLines = [...logLines];\n"
              "      const buildContent = () => '```\\n'\n"
              "        + [...headerLines, ...visibleLines].join('\\n')\n"
              "        + '\\n```';\n"
              "      let content = buildContent();\n"
              "      while (content.length > 1950 && visibleLines.length > 1) {\n"
              "        visibleLines.shift();\n"
              "        content = buildContent();\n"
              "      }"
          )
          runner = replace_once(runner, old, new, 'status rendering')

          old = (
              "  async function reportRunnableCount(count) {\n"
              "    addLog(`🔎 ${username}: พบ ${count} QUESTS`);\n"
              "    await render();\n"
              "  }"
          )
          new = (
              "  async function reportQuestCounts(allQuests, runnableCount) {\n"
              "    totalQuestCount = allQuests.filter((quest) => !quest.completed).length;\n"
              "    runnableQuestCount = runnableCount;\n"
              "    await render();\n"
              "  }"
          )
          runner = replace_once(runner, old, new, 'quest count reporting')

          old = "    if (!countAlreadyReported) {\n      await reportRunnableCount(runnable.length);\n    }"
          new = "    if (!countAlreadyReported) {\n      await reportQuestCounts(allQuests, runnable.length);\n    }"
          runner = replace_once(runner, old, new, 'initial count update')

          old = "    await reportRunnableCount(supportedRemaining);\n    countAlreadyReported = true;"
          new = "    await reportQuestCounts(latestQuests, supportedRemaining);\n    countAlreadyReported = true;"
          runner = replace_once(runner, old, new, 'remaining count update')

          old = (
              "      addLog(`✅ LOGIN : ${username}`);\n"
              "      if (mode === 'scheduled') {\n"
              "        addLog(`🤖 AUTO DAILY ENABLED — CHECK 00:00 / 08:00 / 16:00`);\n"
              "      }\n"
              "      await render();"
          )
          runner = replace_once(runner, old, "      await render();", 'login header initialization')
          runner_path.write_text(runner, encoding='utf-8')

          index_path = Path('bot/src/index.js')
          index_text = index_path.read_text(encoding='utf-8')
          index_text = replace_once(
              index_text,
              "import { installPersistentRunnerStatusHeaders } from './runner-status-header.js';\n",
              '',
              'remove temporary header import',
          )
          index_text = replace_once(
              index_text,
              'installPersistentRunnerStatusHeaders(client);\n',
              '',
              'remove temporary header installer',
          )
          index_path.write_text(index_text, encoding='utf-8')

          test_path = Path('bot/test/runner-modes.node-test.js')
          test_text = test_path.read_text(encoding='utf-8')
          old_count = '🔎 scheduled-user: พบ 0 QUESTS'
          if test_text.count(old_count) != 2:
              raise SystemExit(f'scheduled count assertion: expected 2 matches, found {test_text.count(old_count)}')
          test_text = test_text.replace(old_count, '⚙️ Quest ที่ระบบทำได้ : 0')
          marker = "  assert.match(contents.join('\\n'), /⚙️ Quest ที่ระบบทำได้ : 0/);\n"
          if test_text.count(marker) != 1:
              raise SystemExit(f'runner header assertion marker count: {test_text.count(marker)}')
          test_text = test_text.replace(
              marker,
              marker
              + "  const finalStatus = contents.at(-1);\n"
              + "  assert.match(finalStatus, /^```\\n✅ LOGIN : scheduled-user\\n🤖 AUTO DAILY ENABLED/);\n"
              + "  assert.match(finalStatus, /🔍 ตรวจพบ Quest ทั้งหมด : 0/);\n"
              + "  assert.match(finalStatus, /⚙️ Quest ที่ระบบทำได้ : 0/);\n",
              1,
          )
          test_path.write_text(test_text, encoding='utf-8')

          Path('bot/src/runner-status-header.js').unlink()
          Path('bot/test/runner-status-header.node-test.js').unlink()

      - name: Install bot dependencies
        working-directory: bot
        run: npm ci

      - name: Run bot tests
        working-directory: bot
        run: npm test

      - name: Check changed source syntax
        working-directory: bot
        run: |
          node --check src/index.js
          node --check src/discord-runner.js
          node --check src/commands/run.js
          node --check src/commands/panel.js

      - name: Commit tested result and remove temporary workflow
        run: |
          rm .github/workflows/ss-pin-runner-header.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep runner summary pinned"
          git push origin HEAD:ss
