name: Update one-shot flow expectation

on:
  push:
    branches:
      - aa.1

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout aa.1
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: aa.1
          fetch-depth: 0

      - name: Apply exact test expectation update
        run: python .github/scripts/update-one-shot-flow-expectation.py

      - name: Validate edited test syntax
        run: node --check bot/test/runner-modes.node-test.js

      - name: Commit updated expectation and remove temporary updater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test one-shot reward completion flow"
          git push origin HEAD:aa.1
