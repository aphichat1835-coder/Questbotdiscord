name: Apply runner authority refactor

permissions:
  contents: write

on:
  push:
    branches: [aa.1]
    paths:
      - '.github/workflows/apply-runner-authority.yml'
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout aa.1
        uses: actions/checkout@v6
        with:
          ref: aa.1
          fetch-depth: 0

      - name: Transform runner through authoritative modules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('bot/src/discord-runner.js')
          source = path.read_text()

          def replace_once(pattern, replacement, label, flags=re.S):
              global source
              updated, count = re.subn(pattern, replacement, source, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              source = updated

          import_anchor = """} from './one-shot-quest-session.js';
          import {
            executeQuestExecutor,
            selectQuestExecutor,
          } from './quest/executors.js';
          """
          import_replacement = """} from './one-shot-quest-session.js';
          import {
            claimQuestRequest,
            currentDiscordClientProfile,
            discordFetch as questDiscordFetch,
            enrollQuestRequest,
            fetchCurrentUser,
            fetchQuestPayload,
            sendHeartbeatRequest,
            sendVideoProgressRequest,
          } from './quest/api/discord-client.js';
          import {
            claimRetryAt as durableClaimRetryAt,
            CLAIM_RETRY_REASON,
            classifyClaimRetry,
            persistClaimRetry,
          } from './quest/claim-retry-policy.js';
          import {
            normalizeQuest as normalizeQuestV2,
            normalizeQuestPayload as normalizeQuestPayloadV2,
          } from './quest/schema/normalizer.js';
          import {
            executeQuestExecutor,
            selectQuestExecutor,
          } from './quest/executors.js';
          """
          if import_anchor not in source:
              raise SystemExit('authoritative imports: anchor not found')
          source = source.replace(import_anchor, import_replacement, 1)

          replace_once(
              r"export async function refreshBuildInfo\(\) \{.*?\n\}\n\n// ── Dynamic header builders",
              """export async function refreshBuildInfo() {
            const profile = currentDiscordClientProfile();
            console.log(
              `🔄 Client profile — Client: ${profile.clientVersion} | Build: ${profile.buildNumber} | Chrome: ${profile.chromeVersion} | Electron: ${profile.electronVersion}`,
            );
            return profile;
          }

          // ── Dynamic header builders""",
              'client profile delegation',
          )

          replace_once(
              r"async function discordFetch\(token, path, options = \{\}, policy = \{\}\) \{.*?\n\}\n\n// Quest execution support",
              """async function discordFetch(token, path, options = {}, policy = {}) {
            return questDiscordFetch(token, path, options, policy);
          }

          // Quest execution support""",
              'API fetch delegation',
          )

          replace_once(
              r"export async function fetchMe\(token, signal\) \{.*?\n\}",
              """export async function fetchMe(token, signal) {
            return fetchCurrentUser(token, signal);
          }""",
              'current user delegation',
          )

          replace_once(
              r"async function selectQuestPayload\(token, signal\) \{.*?\n\}\n\nasync function normalizeQuestPayload",
              """async function selectQuestPayload(token, signal) {
            return fetchQuestPayload(token, signal);
          }

          async function normalizeQuestPayload""",
              'Quest payload delegation',
          )

          replace_once(
              r"async function normalizeQuestPayload\(payload\) \{.*?\n\}\n\nfunction summarizeQuestCompatibility",
              """async function normalizeQuestPayload(payload) {
            try {
              return normalizeQuestPayloadV2(payload.quests, payload.enrollmentBlockedUntil);
            } catch (error) {
              const compatibilityError = error instanceof QuestCompatibilityError
                ? error
                : new QuestCompatibilityError(`Quest payload could not be parsed: ${error.message}`);
              recordQuestError(compatibilityError);
              await reportCriticalError('Quest API compatibility', compatibilityError);
              throw compatibilityError;
            }
          }

          function summarizeQuestCompatibility""",
              'Quest schema delegation',
          )

          replace_once(
              r"async function enrollQuest\(token, questId, signal\) \{.*?\n\}\n\nasync function claimQuest",
              """async function enrollQuest(token, questId, signal) {
            return verifiedQuestMutation({
              token,
              questId,
              signal,
              predicate: (fresh) => fresh.enrolled,
              perform: () => enrollQuestRequest(token, questId, signal),
            });
          }

          async function claimQuest""",
              'enroll request delegation',
          )

          replace_once(
              r"async function claimQuest\(token, questId, platform, signal\) \{.*?\n\}\n\nasync function sendVideoProgress",
              """async function claimQuest(token, questId, platform, signal) {
            return verifiedQuestMutation({
              token,
              questId,
              signal,
              perform: () => claimQuestRequest(token, questId, platform, signal),
              predicate: (fresh) => fresh.claimed,
            });
          }

          async function sendVideoProgress""",
              'claim request delegation',
          )

          replace_once(
              r"async function sendVideoProgress\(token, questId, timestamp, signal\) \{.*?\n\}\n\nasync function sendGameHeartbeat",
              """async function sendVideoProgress(token, questId, timestamp, signal) {
            return verifiedQuestMutation({
              token,
              questId,
              signal,
              predicate: (fresh) => fresh.completed || fresh.progressSecs >= Math.floor(timestamp),
              perform: () => sendVideoProgressRequest(token, questId, timestamp, signal),
            });
          }

          async function sendGameHeartbeat""",
              'video request delegation',
          )

          replace_once(
              r"async function sendGameHeartbeat\(token, quest, terminal, signal\) \{.*?\n\}\n\nasync function sendApplicationHeartbeat",
              """async function sendGameHeartbeat(token, quest, terminal, signal) {
            const baseline = quest.progressSecs;
            return verifiedQuestMutation({
              token,
              questId: quest.id,
              signal,
              perform: () => sendHeartbeatRequest(token, quest, terminal, false, signal),
              predicate: (fresh) => fresh.completed || fresh.progressSecs > baseline,
            });
          }

          async function sendApplicationHeartbeat""",
              'heartbeat request delegation',
          )

          replace_once(
              r"async function sendApplicationHeartbeat\(token, quest, terminal, signal\) \{.*?\n\}\n\nfunction questTaskEntries",
              """async function sendApplicationHeartbeat(token, quest, terminal, signal) {
            const baseline = quest.progressSecs;
            return verifiedQuestMutation({
              token,
              questId: quest.id,
              signal,
              predicate: (fresh) => fresh.completed || fresh.progressSecs > baseline,
              perform: () => sendHeartbeatRequest(token, quest, terminal, true, signal),
            });
          }

          function questTaskEntries""",
              'application heartbeat delegation',
          )

          replace_once(
              r"export function normalizeQuest\(raw\) \{.*?\n\}\n\nfunction sleep",
              """export function normalizeQuest(raw) {
            return normalizeQuestV2(raw);
          }

          function sleep""",
              'Quest normalizer delegation',
          )

          replace_once(
              r"  async function claimSilently\(quest\) \{.*?\n  \}\n\n  async function reportOneShotLogout",
              """  async function claimSilently(quest) {
            const retryAt = Math.max(
              claimRetryAt.get(quest.id) ?? 0,
              durableClaimRetryAt(jobKey) ?? 0,
            );
            if (retryAt > Date.now()) return false;
            transitionCurrentRunner(RUNNER_STATE.CLAIMING, {
              questId: quest.id,
              questName: quest.name,
              questEvent: quest.eventName,
              progress: quest.progress,
              serverProgressSeconds: quest.progressSecs,
            });
            const platform = selectQuestClaimPlatform(quest);
            if (platform == null) {
              const retry = classifyClaimRetry(null, { platformAmbiguous: true });
              claimRetryAt.set(quest.id, Date.now() + retry.delayMs);
              persistClaimRetry(jobKey, quest, retry);
              return false;
            }

            try {
              await claimQuest(userToken, quest.id, platform, signal);
              const claimed = await waitForQuestState(
                userToken,
                quest.id,
                (fresh) => fresh.claimed,
                signal,
              );
              if (claimed) {
                claimRetryAt.delete(quest.id);
                recordQuestVerification(currentQuestStatusContext().key, 'claim', currentQuestStatusContext());
                transitionCurrentRunner(RUNNER_STATE.RUNNING, {
                  questId: quest.id,
                  questName: quest.name,
                  questEvent: quest.eventName,
                  progress: 100,
                  serverProgressSeconds: claimed.progressSecs,
                });
              } else {
                const retry = {
                  reason: CLAIM_RETRY_REASON.VERIFICATION_ABSENT,
                  delayMs: CLAIM_RETRY_DELAY_MS,
                  error: new Error('Discord has not confirmed claimed_at after verification'),
                };
                claimRetryAt.set(quest.id, Date.now() + retry.delayMs);
                persistClaimRetry(jobKey, quest, retry);
              }
              return Boolean(claimed);
            } catch (error) {
              if (isAbortFailure(error, signal)) throw abortFailure();
              rethrowFatalAuth(error);
              const retry = classifyClaimRetry(error);
              claimRetryAt.set(quest.id, Date.now() + retry.delayMs);
              persistClaimRetry(jobKey, quest, retry);
              return false;
            }
          }

          async function reportOneShotLogout""",
              'durable claim retry wiring',
          )

          replace_once(
              r"  async function executeQuestProgress\(quest, selection, hooks\) \{.*?\n  \}\n\n  async function verifyQuestCompletion",
              """  async function executeQuestProgress(quest, selection, hooks) {
            const executor = questExecutor(quest);
            try {
              const execution = await executeQuestExecutor(executor, {
                quest,
                signal,
                heartbeatInterval,
                sleep,
                fetchFreshQuest: (questId, executorSignal) => fetchFreshQuest(
                  userToken,
                  questId,
                  executorSignal,
                ),
                sendVideoProgress: (questId, timestamp, executorSignal) => sendVideoProgress(
                  userToken,
                  questId,
                  timestamp,
                  executorSignal,
                ),
                sendHeartbeat: (
                  executorQuest,
                  terminal,
                  useApplicationPayload,
                  executorSignal,
                ) => sendQuestHeartbeat(
                  userToken,
                  executorQuest,
                  terminal,
                  useApplicationPayload,
                  executorSignal,
                ),
                onServerProgress: hooks.onServerProgress,
                onMutationAccepted: hooks.onMutationAccepted,
              });
              if (!execution.verified) {
                throw new QuestCompatibilityError(
                  `Quest executor ${executor.id} did not return verified completion`,
                );
              }
              if (signal.aborted) throw new Error('aborted');
              return null;
            } catch (error) {
              rethrowFatalAuth(error);
              if (signal.aborted) throw new Error('aborted');
              if (mode === 'oneshot') {
                return reportOneShotFailure(quest, 'การส่งความคืบหน้าไม่สำเร็จ');
              }
              if (error.message !== 'aborted') {
                addLog(`⚠️ ${username}: ERROR ${error.message}`);
              }
              await render();
              return attemptedQuestOutcome(selection.runnable.length);
            }
          }

          async function verifyQuestCompletion""",
              'executor runtime delegation',
          )

          path.write_text(source)
          PY
          node --check bot/src/discord-runner.js

      - name: Commit runtime authority wiring
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot/src/discord-runner.js
          git commit -m 'refactor(quest): centralize runtime and persist claim retries'
          git push origin HEAD:aa.1
