name: Export Runner Source

on:
  push:
    branches:
      - aa.1

permissions:
  contents: read

jobs:
  export-runner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload runner source
        uses: actions/upload-artifact@v4
        with:
          name: runner-source
          path: bot/src/discord-runner.js
          if-no-files-found: error
          retention-days: 1
