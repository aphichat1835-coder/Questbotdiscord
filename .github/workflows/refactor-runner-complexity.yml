name: Refactor Runner complexity

permissions:
  contents: write

on:
  push:
    branches: [ss]
    paths:
      - bot/scripts/refactor-runner-complexity.mjs
      - .github/workflows/refactor-runner-complexity.yml

concurrency:
  group: refactor-runner-complexity-ss
  cancel-in-progress: false

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ss
        uses: actions/checkout@v6
        with:
          ref: ss

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: bot/.node-version
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Install locked dependencies without lifecycle scripts
        working-directory: bot
        run: npm ci --ignore-scripts --no-fund --no-audit

      - name: Rebuild trusted native dependency
        working-directory: bot
        run: npm rebuild better-sqlite3 --foreground-scripts

      - name: Apply guarded refactor
        working-directory: bot
        run: node scripts/refactor-runner-complexity.mjs

      - name: Validate refactored repository
        working-directory: bot
        run: |
          npm run validate:quest-fixture
          npm test
          npm run check
          npm audit --omit=dev --audit-level=high

      - name: Commit refactored Runner
        run: |
          test -n "$(git status --short -- bot/src/discord-runner.js)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/src/discord-runner.js
          git commit -m "decompose Quest fetch and Runner lifecycle"
          git push origin HEAD:ss
