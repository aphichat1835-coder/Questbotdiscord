name: Target check diagnostics

permissions:
  contents: read
  checks: read

on:
  push:
    branches: [diag-aa-checks]
  pull_request:
    branches: [main]

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Inspect Codacy and Sonar checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: cf4335cef22f6e5fa4c5d1d8ce098b9e9cec46bb
        run: node .github/scripts/inspect-target-checks.mjs

      - name: Upload check evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: target-check-evidence-${{ github.run_id }}
          path: target-check-evidence.json
          if-no-files-found: warn
          retention-days: 1
