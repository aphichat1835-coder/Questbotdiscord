name: Sync final audit documentation on PR

on:
  pull_request:
    branches:
      - aa
    types:
      - synchronize

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.number == 15 && github.event.pull_request.head.ref == 'aa.1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout aa.1
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: aa.1
          fetch-depth: 0

      - name: Update documentation by stable markers
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def insert_after_line(path, marker, new_lines):
              file = Path(path)
              lines = file.read_text(encoding='utf-8').splitlines()
              if any(line in lines for line in new_lines):
                  return
              indices = [index for index, line in enumerate(lines) if line == marker]
              if len(indices) != 1:
                  raise SystemExit(f'{path}: marker {marker!r} matched {len(indices)} lines')
              index = indices[0] + 1
              lines[index:index] = new_lines
              file.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          def replace_section(path, start_marker, end_marker, replacement):
              file = Path(path)
              source = file.read_text(encoding='utf-8')
              start = source.find(start_marker)
              end = source.find(end_marker, start + len(start_marker))
              if start == -1 or end == -1:
                  raise SystemExit(f'{path}: section markers not found')
              file.write_text(source[:start] + replacement.rstrip() + '\n\n' + source[end:], encoding='utf-8')

          engine = 'bot/QUEST-ENGINE.md'
          insert_after_line(engine, '├─ claim-retry-policy.js', ['├─ discord-api-runtime.js'])
          insert_after_line(engine, '├─ rate-limit-coordinator.js', ['├─ recovery-fetch.js'])
          insert_after_line(engine, '├─ runner-ownership-guard.js', ['├─ runner-start-rollback.js'])
          insert_after_line(engine, '├─ smart-scheduler.js', ['├─ smart-wake-controller.js', '└─ worker-discord-client.js'])
          engine_path = Path(engine)
          text = engine_path.read_text(encoding='utf-8')
          text = text.replace('├─ smart-wake-controller.js\n└─ smart-wake-controller.js', '├─ smart-wake-controller.js\n└─ worker-discord-client.js')
          engine_path.write_text(text, encoding='utf-8')

          insert_after_line(engine, '- All-in-one delayed recovery → `quest/all-mode-recovery.js`', [
              '- Transient durable recovery fetch policy → `quest/recovery-fetch.js`',
              '- Post-start rollback → `quest/runner-start-rollback.js`',
              '- Standalone Worker Discord REST output → `quest/worker-discord-client.js`',
          ])
          insert_after_line(engine, '- Control และ Workers ต้องใช้ SQLite ไฟล์เดียวกันจริง', [
              '- SQLite ใช้ `busy_timeout=5000` เพื่อรอ Write contention แบบมีขอบเขต',
              '- Schema migration, Runtime lease และ Scheduled claim acquisition ใช้ Immediate transaction เพื่อ Serialize การแย่งสิทธิ์ข้าม Process',
          ])

          evidence = '''Validated implementation HEAD ก่อน Final documentation sync:

`45e508c08ef9e15c10acefb22dbb7ce15462bf3a`

GitHub Actions CI ของ Implementation HEAD นี้:

- `#1739` — Success
- `#1740` — Success

ผลจาก Artifact ของ CI #1740:

- 462 tests passed
- 0 failed
- 0 cancelled
- 0 skipped
- 0 todo
- Coverage: 93.78% lines / 85.22% branches / 89.28% functions
- LCOV generated: 393,076 bytes
- Mutation baseline ผ่าน
- Critical mutation groups 14/14, 15/15 และ 26/26 ถูก Kill
- Dedicated recovery metadata mutation ถูก Kill
- Mutation scripts คืน Source ครบ
- Repository shape, Sanitized Quest fixture, Backup destinations และ Incident/storage boundaries ผ่าน
- JS/MJS/Bash syntax ผ่าน
- Production dependency audit ระดับ High ผ่าน

Full-source audit รอบนี้เพิ่มการตรวจและ Regression coverage สำหรับ:

- Worker readiness, Startup rollback และ Shutdown isolation
- SQLite busy timeout, Immediate migration/lease/claim transactions และ STOPPING มากกว่า 500 แถว
- Route-to-bucket remapping, Scope migration, Global 429 durable deadline และ Queue cancellation
- CAPTCHA heartbeat, Fatal auth precedence และ malformed Headers
- Durable recovery fetch deferral และ All-mode retry persistence
- Backup/Incident recovery lifecycle, recurrence during recovery และ Discord embed total budget
- Credential redaction, `/api-status` privacy และ explicit `emergency:false`
- Worker REST timeout, Fetch Promise semantics และ Execution-context remapping
- README permissions, Environment defaults และ Architecture boundary parsing

External scanners ต้องยืนยันซ้ำบน Final documentation HEAD; CI-based Sonar จะถูก Skip หาก Repository ไม่มี `SONAR_TOKEN`

Documentation-only commits หลัง Implementation HEAD นี้ต้องผ่าน CI ของตัวเอง แต่ไม่เปลี่ยนผล Implementation evidence ข้างต้น'''
          replace_section(
              engine,
              'Validated implementation HEAD ก่อน Documentation-only sync:',
              'Mutation gates ที่ยังบังคับใช้อยู่ครอบคลุม:',
              evidence,
          )

          checklist = 'bot/PRODUCTION-CHECKLIST.md'
          insert_after_line(checklist, '- [ ] Worker อื่น Takeover ได้หลัง Claim หมดอายุ', [
              '- [ ] SQLite `busy_timeout` เป็น 5000 ms',
              '- [ ] Schema migration, Runtime lease และ Scheduled claim acquisition Serialize ด้วย Immediate transaction',
          ])
          path = Path(checklist)
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              '- [ ] Recovery fetch ที่จบระหว่าง `FETCHING_QUESTS` → `WAITING_RETRY`',
              '- [ ] Transient recovery fetch ถูก Defer เข้า Normal loop; Abort และ Fatal auth ยังเป็น Terminal ตาม Policy',
          )
          source = source.replace(
              '- [ ] Global 429 หยุด Queue ทั้งหมด\n- [ ] Authorization เป็น Fingerprint ไม่ใช่ Raw token',
              '- [ ] Global 429 หยุด Queue ทั้งหมดและ Persist `next_action_at` ที่ตรงกับ Server delay\n- [ ] Route-to-bucket และ Scope remapping ย้าย Reset/Circuit state โดยไม่ทิ้ง State เก่า\n- [ ] Authorization เป็น Fingerprint ไม่ใช่ Raw token',
          )
          path.write_text(source, encoding='utf-8')
          PY

      - name: Commit and push documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/QUEST-ENGINE.md bot/PRODUCTION-CHECKLIST.md
          git commit -m "docs: sync final full-audit architecture evidence"
          git push origin HEAD:aa.1
