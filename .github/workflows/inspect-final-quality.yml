name: Inspect final quality

permissions:
  contents: read
  checks: read

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/inspect-final-quality.yml
  push:
    branches: [ss]
    paths:
      - .github/workflows/inspect-final-quality.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: eb5b3e999c2c3d8639f99b0a6b504232c176da86
    steps:
      - name: Capture check runs and annotations
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def read_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          repository = os.environ['REPOSITORY']
          sha = os.environ['TARGET_SHA']
          checks = read_json(
              f'https://api.github.com/repos/{repository}/commits/{sha}/check-runs?per_page=100'
          )
          annotations = {}
          for check in checks.get('check_runs', []):
              count = check.get('output', {}).get('annotations_count', 0)
              if count:
                  annotations[check['name']] = read_json(
                      f"{check['output']['annotations_url']}?per_page=100"
                  )

          with open('final-quality-checks.json', 'w', encoding='utf-8') as handle:
              json.dump(checks, handle, indent=2, ensure_ascii=False)
          with open('final-quality-annotations.json', 'w', encoding='utf-8') as handle:
              json.dump(annotations, handle, indent=2, ensure_ascii=False)
          PY

      - name: Upload final quality evidence
        uses: actions/upload-artifact@v4
        with:
          name: final-quality-evidence-${{ github.run_id }}
          path: |
            final-quality-checks.json
            final-quality-annotations.json
          if-no-files-found: error
          retention-days: 1
