name: Inspect latest quality

permissions:
  contents: read
  checks: read

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/inspect-latest-quality.yml
  push:
    branches: [ss]
    paths:
      - .github/workflows/inspect-latest-quality.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: 697f8351744e723eff8cc76e0c4a006e3addc147
    steps:
      - name: Capture external check runs and annotations
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def read_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          repository = os.environ['REPOSITORY']
          sha = os.environ['TARGET_SHA']
          check_url = f'https://api.github.com/repos/{repository}/commits/{sha}/check-runs?per_page=100'
          checks = None
          for _ in range(24):
              checks = read_json(check_url)
              selected = {
                  item['name']: item
                  for item in checks.get('check_runs', [])
                  if item.get('name') in {'SonarCloud Code Analysis', 'Codacy Static Code Analysis'}
              }
              if len(selected) == 2 and all(item.get('status') == 'completed' for item in selected.values()):
                  break
              time.sleep(10)

          annotations = {}
          for check in checks.get('check_runs', []):
              count = check.get('output', {}).get('annotations_count', 0)
              if count:
                  annotations[check['name']] = read_json(
                      f"{check['output']['annotations_url']}?per_page=100"
                  )

          with open('latest-quality-checks.json', 'w', encoding='utf-8') as handle:
              json.dump(checks, handle, indent=2, ensure_ascii=False)
          with open('latest-quality-annotations.json', 'w', encoding='utf-8') as handle:
              json.dump(annotations, handle, indent=2, ensure_ascii=False)
          PY

      - name: Upload latest quality evidence
        uses: actions/upload-artifact@v4
        with:
          name: latest-quality-evidence-${{ github.run_id }}
          path: |
            latest-quality-checks.json
            latest-quality-annotations.json
          if-no-files-found: error
          retention-days: 1
