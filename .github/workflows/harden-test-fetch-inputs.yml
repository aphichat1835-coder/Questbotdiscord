name: Harden test fetch inputs

permissions:
  contents: write

on:
  push:
    branches: [ss]
    paths:
      - bot/scripts/harden-test-fetch-inputs.mjs
      - .github/workflows/harden-test-fetch-inputs.yml

concurrency:
  group: harden-test-fetch-inputs-ss
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ss
        uses: actions/checkout@v6
        with:
          ref: ss

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: bot/.node-version
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Install locked dependencies without lifecycle scripts
        working-directory: bot
        run: npm ci --ignore-scripts --no-fund --no-audit

      - name: Rebuild trusted native dependency
        working-directory: bot
        run: npm rebuild better-sqlite3 --foreground-scripts

      - name: Apply guarded fetch input hardening
        working-directory: bot
        run: node scripts/harden-test-fetch-inputs.mjs

      - name: Validate repository
        working-directory: bot
        run: |
          npm run validate:quest-fixture
          npm test
          npm run check
          npm audit --omit=dev --audit-level=high

      - name: Commit hardened tests
        run: |
          test -n "$(git status --short -- bot/test)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/test
          git commit -m "harden mocked fetch input handling"
          git push origin HEAD:ss
