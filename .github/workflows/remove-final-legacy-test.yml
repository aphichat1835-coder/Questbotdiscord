name: Remove final legacy test

permissions:
  contents: write

on:
  push:
    branches: [ss]
    paths:
      - bot/scripts/remove-final-legacy-test.mjs
      - .github/workflows/remove-final-legacy-test.yml

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ss
        uses: actions/checkout@v6
        with:
          ref: ss

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: bot/.node-version
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Install locked dependencies
        working-directory: bot
        run: npm ci --no-fund --no-audit

      - name: Remove legacy test
        working-directory: bot
        run: node scripts/remove-final-legacy-test.mjs

      - name: Validate repository
        working-directory: bot
        run: |
          npm test
          npm run check
          npm audit --omit=dev --audit-level=high

      - name: Commit cleanup
        run: |
          if git diff --quiet -- bot/test/runner-modes.node-test.js; then
            echo "Legacy test already removed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/test/runner-modes.node-test.js
          git commit -m "remove final legacy panel modal test"
          git push origin HEAD:ss
