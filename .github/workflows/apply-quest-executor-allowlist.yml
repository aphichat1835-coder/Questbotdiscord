name: Apply Quest executor allowlist

on:
  push:
    branches:
      - aa.1

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout aa.1
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: aa.1
          fetch-depth: 0

      - name: Apply verified executor allowlist
        run: python .github/scripts/apply-quest-executor-allowlist.py

      - name: Validate executors and regression test syntax
        run: |
          node --check bot/src/quest/executors/video-executor.js
          node --check bot/src/quest/executors/desktop-executor.js
          node --check bot/test/quest-executor-allowlist.node-test.js

      - name: Commit change and remove temporary updater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix quarantine unverified Quest events"
          git push origin HEAD:aa.1
