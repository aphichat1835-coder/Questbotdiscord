name: Apply One-Shot Reward Runner Patch

on:
  push:
    branches:
      - aa.1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: aa.1
          fetch-depth: 0

      - name: Apply exact runner patch and remove temporary files
        run: python .github/scripts/apply-one-shot-reward-runner.py

      - name: Validate patched runner
        run: node --check bot/src/discord-runner.js

      - name: Commit patched runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Report one-shot reward claim outcomes"
          git push origin HEAD:aa.1
